<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Trace</title>
<meta name="description" content="A place for thoughts you don't want to lose.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trace">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script>
/* Runs before first paint: if a passcode is set (or not yet configured),
   mark the document locked so no note is ever visible for a frame. */
try{
  var _s = JSON.parse(localStorage.getItem('trace.settings.v1') || '{}');
  if (!_s.lock || _s.lock.enabled !== false) document.documentElement.setAttribute('data-locked','1');
}catch(e){ document.documentElement.setAttribute('data-locked','1'); }
</script>
<style>
/* ─────────────────────────────────────────────────────────────
   Trace — design tokens
   ───────────────────────────────────────────────────────────── */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;

  --r-xs: 6px;  --r-sm: 10px;  --r-md: 14px;  --r-lg: 20px;  --r-xl: 28px;
  --e-out: cubic-bezier(.32,.72,0,1);
  --e-io:  cubic-bezier(.4,0,.2,1);
  --t-fast: .16s; --t-med: .3s; --t-slow: .52s;

  --sidebar-w: 224px;
  --detail-w: 380px;
  --safe-t: env(safe-area-inset-top,0px);
  --safe-b: env(safe-area-inset-bottom,0px);
  --safe-l: env(safe-area-inset-left,0px);
  --safe-r: env(safe-area-inset-right,0px);
}

/* Light */
:root{
  --bg:            #ffffff;
  --bg-under:      #f2f2f7;
  --chrome:        rgba(242,242,246,.80);
  --chrome-solid:  #f6f6f8;
  --elev:          rgba(255,255,255,.86);
  --text:          #1d1d1f;
  --text-2:        #6e6e73;
  --text-3:        #a5a5aa;
  --sep:           rgba(0,0,0,.085);
  --sep-strong:    rgba(0,0,0,.14);
  --fill:          rgba(118,118,128,.10);
  --fill-2:        rgba(118,118,128,.16);
  --fill-3:        rgba(118,118,128,.22);
  --accent:        #0071e3;
  --accent-soft:   rgba(0,113,227,.12);
  --accent-text:   #0071e3;
  --amber:         #b25000;
  --red:           #d70015;
  --green:         #248a3d;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05), 0 0 0 .5px rgba(0,0,0,.05);
  --shadow-md: 0 4px 16px rgba(0,0,0,.08), 0 0 0 .5px rgba(0,0,0,.06);
  --shadow-lg: 0 24px 68px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.08);
  --glow: none;
  color-scheme: light;
}
/* Dark */
@media (prefers-color-scheme: dark){
  :root{
    --bg:            #000000;
    --bg-under:      #0a0a0b;
    --chrome:        rgba(28,28,30,.68);
    --chrome-solid:  #1c1c1e;
    --elev:          rgba(38,38,41,.82);
    --text:          #f5f5f7;
    --text-2:        #9a9aa0;
    --text-3:        #636368;
    --sep:           rgba(255,255,255,.09);
    --sep-strong:    rgba(255,255,255,.16);
    --fill:          rgba(120,120,128,.18);
    --fill-2:        rgba(120,120,128,.26);
    --fill-3:        rgba(120,120,128,.34);
    --accent:        #0a84ff;
    --accent-soft:   rgba(10,132,255,.18);
    --accent-text:   #4da2ff;
    --amber:         #ff9f0a;
    --red:           #ff453a;
    --green:         #30d158;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.06);
    --shadow-md: 0 6px 24px rgba(0,0,0,.55), 0 0 0 .5px rgba(255,255,255,.08);
    --shadow-lg: 0 30px 80px rgba(0,0,0,.7), 0 0 0 .5px rgba(255,255,255,.1);
    color-scheme: dark;
  }
}
/* Manual overrides */
html[data-theme="light"]{ color-scheme: light; }
html[data-theme="dark"]{
  --bg:#000; --bg-under:#0a0a0b; --chrome:rgba(28,28,30,.68); --chrome-solid:#1c1c1e;
  --elev:rgba(38,38,41,.82); --text:#f5f5f7; --text-2:#9a9aa0; --text-3:#636368;
  --sep:rgba(255,255,255,.09); --sep-strong:rgba(255,255,255,.16);
  --fill:rgba(120,120,128,.18); --fill-2:rgba(120,120,128,.26); --fill-3:rgba(120,120,128,.34);
  --accent:#0a84ff; --accent-soft:rgba(10,132,255,.18); --accent-text:#4da2ff;
  --amber:#ff9f0a; --red:#ff453a; --green:#30d158;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.06);
  --shadow-md:0 6px 24px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.08);
  --shadow-lg:0 30px 80px rgba(0,0,0,.7),0 0 0 .5px rgba(255,255,255,.1);
  color-scheme: dark;
}

/* ─── reset ─── */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-size:15px; line-height:1.47; letter-spacing:-.011em;
  overscroll-behavior:none; -webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{ font:inherit; color:inherit; letter-spacing:inherit; }
button{ background:none; border:0; padding:0; cursor:pointer; }
input,textarea{ background:none; border:0; outline:0; resize:none; }
::selection{ background:var(--accent-soft); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-xs); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:transparent; border-radius:8px; border:3px solid transparent; background-clip:content-box; }
*:hover::-webkit-scrollbar-thumb{ background:var(--fill-2); background-clip:content-box; }

/* ─── app frame ─── */
#app{ display:flex; height:100dvh; width:100%; overflow:hidden; background:var(--bg-under); }

/* ─────────── SIDEBAR ─────────── */
#sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
  background:var(--chrome); backdrop-filter:saturate(180%) blur(30px);
  -webkit-backdrop-filter:saturate(180%) blur(30px);
  border-right:.5px solid var(--sep);
  display:flex; flex-direction:column;
  padding:calc(var(--safe-t) + 14px) 0 calc(var(--safe-b) + 8px) 0;
  padding-left:var(--safe-l);
  transition:margin-left var(--t-med) var(--e-out);
}
.brand{
  display:flex; align-items:center; gap:8px; padding:2px 16px 14px;
  -webkit-app-region:drag;
}
.brand .mark{
  width:22px; height:22px; border-radius:7px; flex:0 0 22px;
  background:linear-gradient(160deg,var(--text) 0%,var(--text-2) 100%);
  display:grid; place-items:center;
}
.brand .mark svg{ width:13px; height:13px; }
.brand h1{
  margin:0; font-size:15px; font-weight:590; letter-spacing:-.02em;
}
.nav{ flex:1; overflow-y:auto; padding:0 8px; }
.nav-group{ margin-bottom:16px; }
.nav-label{
  font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  color:var(--text-3); padding:0 8px 5px;
}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%;
  padding:6px 8px; border-radius:var(--r-xs); margin-bottom:1px;
  font-size:13.5px; font-weight:450; color:var(--text); text-align:left;
  transition:background var(--t-fast) var(--e-io);
}
.nav-item:hover{ background:var(--fill); }
.nav-item.active{ background:var(--fill-2); font-weight:520; }
.nav-item .ico{ width:16px; height:16px; flex:0 0 16px; color:var(--text-2); }
.nav-item.active .ico{ color:var(--accent-text); }
.nav-item .lbl{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nav-item .cnt{ font-size:12px; color:var(--text-3); font-variant-numeric:tabular-nums; }
.nav-item .dot{ width:7px; height:7px; border-radius:50%; flex:0 0 7px; }
.sidebar-foot{ padding:8px 8px 0; border-top:.5px solid var(--sep); margin:0 8px; }

/* ─────────── CENTER COLUMN ─────────── */
#center{
  flex:1; min-width:0; display:flex; flex-direction:column;
  background:var(--bg); position:relative;
}
.topbar{
  display:flex; align-items:center; gap:10px;
  padding:calc(var(--safe-t) + 10px) 16px 10px;
  border-bottom:.5px solid var(--sep);
  background:var(--chrome); backdrop-filter:saturate(180%) blur(30px);
  -webkit-backdrop-filter:saturate(180%) blur(30px);
  position:sticky; top:0; z-index:20;
}
.icon-btn{
  width:30px; height:30px; border-radius:var(--r-xs); display:grid; place-items:center;
  color:var(--text-2); flex:0 0 30px;
  transition:background var(--t-fast) var(--e-io), color var(--t-fast) var(--e-io);
}
.icon-btn:hover{ background:var(--fill); color:var(--text); }
.icon-btn.on{ background:var(--accent-soft); color:var(--accent-text); }
.icon-btn svg{ width:17px; height:17px; }
#menuBtn{ display:none; }
.view-title{ font-size:15px; font-weight:590; letter-spacing:-.02em; flex:0 0 auto; }
.view-sub{ font-size:12.5px; color:var(--text-3); font-variant-numeric:tabular-nums; }
.topbar .spacer{ flex:1; }

.search-wrap{
  display:flex; align-items:center; gap:7px; flex:1; max-width:340px;
  background:var(--fill); border-radius:var(--r-sm); padding:5px 9px;
  transition:background var(--t-fast) var(--e-io), box-shadow var(--t-fast) var(--e-io);
}
.search-wrap:focus-within{ background:var(--bg); box-shadow:0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent); }
.search-wrap svg{ width:14px; height:14px; color:var(--text-3); flex:0 0 14px; }
.search-wrap input{ flex:1; min-width:0; font-size:13.5px; }
.search-wrap input::placeholder{ color:var(--text-3); }
.kbd{
  font-family:var(--font); font-size:11px; font-weight:500; color:var(--text-3);
  background:var(--fill-2); border-radius:4px; padding:1.5px 5px; letter-spacing:0;
}

/* ─── capture ─── */
#capture{
  padding:20px 24px 16px; border-bottom:.5px solid var(--sep);
  background:var(--bg); position:relative;
  transition:padding var(--t-med) var(--e-out);
}
#capture.focused{ padding-bottom:12px; }
.cap-shell{
  border-radius:var(--r-md); background:var(--bg);
  box-shadow:0 0 0 1px var(--sep-strong);
  transition:box-shadow var(--t-med) var(--e-out), transform var(--t-med) var(--e-out);
}
#capture.focused .cap-shell{
  box-shadow:0 0 0 1px var(--accent), 0 0 0 4px var(--accent-soft), var(--shadow-md);
}
#capInput{
  width:100%; display:block; padding:14px 16px 4px; font-size:16.5px; line-height:1.5;
  min-height:52px; max-height:44vh; overflow-y:auto; letter-spacing:-.014em;
  font-family:var(--font);
}
#capInput::placeholder{ color:var(--text-3); }
.cap-bar{
  display:flex; align-items:center; gap:6px; padding:6px 10px 8px 12px;
  opacity:0; max-height:0; overflow:hidden;
  transition:opacity var(--t-med) var(--e-out), max-height var(--t-med) var(--e-out);
}
#capture.focused .cap-bar, #capture.dirty .cap-bar{ opacity:1; max-height:52px; }
.cap-hint{ flex:1; font-size:12px; color:var(--text-3); }
.cap-hint b{ font-weight:500; color:var(--text-2); }
.btn{
  display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 12px;
  border-radius:999px; font-size:13px; font-weight:510; letter-spacing:-.01em;
  background:var(--fill-2); color:var(--text);
  transition:background var(--t-fast) var(--e-io), transform var(--t-fast) var(--e-out), opacity var(--t-fast);
}
.btn:hover{ background:var(--fill-3); }
.btn:active{ transform:scale(.96); }
.btn.primary{ background:var(--accent); color:#fff; }
.btn.primary:hover{ filter:brightness(1.08); }
.btn.ghost{ background:transparent; color:var(--text-2); }
.btn.ghost:hover{ background:var(--fill); color:var(--text); }
.btn[disabled]{ opacity:.4; pointer-events:none; }
.btn svg{ width:14px; height:14px; }
.btn.sm{ height:24px; font-size:12px; padding:0 9px; }

.mic-btn{ position:relative; }
.mic-btn.rec{ background:var(--red); color:#fff; }
.mic-btn.rec::after{
  content:''; position:absolute; inset:-4px; border-radius:999px;
  border:2px solid var(--red); animation:pulse 1.6s var(--e-io) infinite;
}
@keyframes pulse{ 0%{opacity:.7;transform:scale(1)} 100%{opacity:0;transform:scale(1.35)} }

/* ─── list ─── */
#listScroll{ flex:1; overflow-y:auto; overscroll-behavior:contain; }
#list{ padding:6px 12px calc(var(--safe-b) + 80px); }
.day-head{
  display:flex; align-items:baseline; gap:8px;
  padding:18px 12px 6px; position:sticky; top:0; z-index:5;
  background:linear-gradient(var(--bg) 62%, transparent);
  backdrop-filter:blur(2px);
}
.day-head h3{ margin:0; font-size:13px; font-weight:600; letter-spacing:-.01em; }
.day-head span{ font-size:11.5px; color:var(--text-3); font-variant-numeric:tabular-nums; }

.note{
  position:relative; display:block; width:100%; text-align:left;
  padding:11px 13px; border-radius:var(--r-sm); margin-bottom:2px;
  transition:background var(--t-fast) var(--e-io);
  animation:noteIn var(--t-slow) var(--e-out) both;
}
@keyframes noteIn{ from{opacity:0; transform:translateY(6px) scale(.995)} to{opacity:1;transform:none} }
.note:hover{ background:var(--fill); }
.note.sel{ background:var(--fill-2); }
.note.sel::before{
  content:''; position:absolute; left:0; top:9px; bottom:9px; width:3px;
  border-radius:0 3px 3px 0; background:var(--accent);
}
.note-top{ display:flex; align-items:center; gap:7px; margin-bottom:2px; }
.note-title{
  font-size:14px; font-weight:560; letter-spacing:-.014em; color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0;
}
.note-time{ font-size:11.5px; color:var(--text-3); font-variant-numeric:tabular-nums; flex:0 0 auto; }
.note-body{
  font-size:13.5px; color:var(--text-2); line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  white-space:pre-wrap; word-break:break-word;
}
.note-meta{ display:flex; align-items:center; gap:5px; margin-top:6px; flex-wrap:wrap; }
.tag{
  font-size:11px; font-weight:500; padding:2px 7px; border-radius:999px;
  background:var(--fill); color:var(--text-2); letter-spacing:-.005em;
}
.tag.ai{ background:var(--accent-soft); color:var(--accent-text); }
.star{ color:var(--amber); width:12px; height:12px; flex:0 0 12px; }
mark{ background:rgba(255,214,10,.34); color:inherit; border-radius:3px; padding:0 1px; }
html[data-theme="dark"] mark, :root:not([data-theme]) mark{ }
@media (prefers-color-scheme: dark){ mark{ background:rgba(255,214,10,.26); } }

.empty{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; padding:72px 32px; text-align:center; color:var(--text-3);
  animation:noteIn var(--t-slow) var(--e-out) both;
}
.empty svg{ width:30px; height:30px; opacity:.45; margin-bottom:4px; }
.empty h4{ margin:0; font-size:14.5px; font-weight:560; color:var(--text-2); letter-spacing:-.015em; }
.empty p{ margin:0; font-size:13px; max-width:270px; line-height:1.5; }

/* ─────────── DETAIL ─────────── */
#detail{
  width:var(--detail-w); flex:0 0 var(--detail-w);
  background:var(--chrome); backdrop-filter:saturate(180%) blur(30px);
  -webkit-backdrop-filter:saturate(180%) blur(30px);
  border-left:.5px solid var(--sep);
  display:flex; flex-direction:column; overflow:hidden;
  padding-right:var(--safe-r);
}
#detail[hidden]{ display:none; }
.d-head{
  display:flex; align-items:center; gap:6px;
  padding:calc(var(--safe-t) + 10px) 12px 10px 16px; border-bottom:.5px solid var(--sep);
}
.d-head .t{ flex:1; font-size:13px; font-weight:600; letter-spacing:-.01em; }
.d-scroll{ flex:1; overflow-y:auto; padding:16px 18px calc(var(--safe-b) + 24px); }
.d-title{
  font-size:19px; font-weight:640; letter-spacing:-.026em; line-height:1.28; margin:0 0 3px;
}
.d-stamp{ font-size:12px; color:var(--text-3); font-variant-numeric:tabular-nums; margin-bottom:14px; }
.d-body{
  font-size:14.5px; line-height:1.62; white-space:pre-wrap; word-break:break-word;
  width:100%; display:block; font-family:var(--font); letter-spacing:-.008em;
  min-height:80px; padding:0;
}
.d-sec{ margin-top:22px; padding-top:16px; border-top:.5px solid var(--sep); }
.d-sec-h{
  display:flex; align-items:center; gap:6px; margin-bottom:9px;
  font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--text-3);
}
.d-sec-h svg{ width:12px; height:12px; }
.d-sec-h .grow{ flex:1; }
.chips{ display:flex; flex-wrap:wrap; gap:5px; }
.chip{
  font-size:12px; padding:3px 9px; border-radius:999px; background:var(--fill);
  color:var(--text-2); transition:background var(--t-fast);
}
button.chip:hover{ background:var(--fill-2); color:var(--text); }
.chip.add{ border:1px dashed var(--sep-strong); background:transparent; }
.ai-card{
  background:var(--fill); border-radius:var(--r-sm); padding:11px 12px;
  font-size:13.5px; line-height:1.55; color:var(--text-2);
}
.ai-card strong{ color:var(--text); font-weight:560; }
.link-note{
  display:block; width:100%; text-align:left; padding:8px 10px; border-radius:var(--r-xs);
  margin-bottom:2px; transition:background var(--t-fast);
}
.link-note:hover{ background:var(--fill); }
.link-note .t{ font-size:13px; font-weight:520; color:var(--text); display:block;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.link-note .s{ font-size:11.5px; color:var(--text-3); }

/* ─────────── ASK / AI VIEW ─────────── */
#askView{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
#askView[hidden]{ display:none !important; }
.ask-scroll{ flex:1; overflow-y:auto; padding:24px 0 24px; }
.ask-inner{ max-width:680px; margin:0 auto; padding:0 24px; }
.msg{ margin-bottom:22px; animation:noteIn var(--t-slow) var(--e-out) both; }
.msg .who{
  font-size:11px; font-weight:600; letter-spacing:.045em; text-transform:uppercase;
  color:var(--text-3); margin-bottom:6px; display:flex; align-items:center; gap:6px;
}
.msg .who svg{ width:12px; height:12px; }
.msg .txt{ font-size:15px; line-height:1.62; white-space:pre-wrap; letter-spacing:-.01em; }
.msg.me .txt{ font-weight:500; }
.msg .cites{ display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
.cite{
  font-size:11.5px; padding:3px 9px; border-radius:999px; background:var(--fill);
  color:var(--text-2); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
button.cite:hover{ background:var(--fill-2); color:var(--text); }
.ask-bar{
  border-top:.5px solid var(--sep); padding:12px 24px calc(var(--safe-b) + 14px);
  background:var(--chrome); backdrop-filter:blur(30px);
}
.ask-bar-inner{ max-width:680px; margin:0 auto; display:flex; align-items:flex-end; gap:8px;
  background:var(--bg); border-radius:var(--r-md); box-shadow:0 0 0 1px var(--sep-strong); padding:8px 8px 8px 14px; }
.ask-bar-inner:focus-within{ box-shadow:0 0 0 1px var(--accent), 0 0 0 4px var(--accent-soft); }
#askInput{ flex:1; font-size:15px; line-height:1.5; max-height:180px; overflow-y:auto; padding:5px 0; }
.typing{ display:inline-flex; gap:3px; align-items:center; height:1em; }
.typing i{ width:5px;height:5px;border-radius:50%;background:var(--text-3);animation:blink 1.2s var(--e-io) infinite; }
.typing i:nth-child(2){animation-delay:.18s} .typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{ 0%,60%,100%{opacity:.25} 30%{opacity:1} }
.suggest{ display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
.suggest button{
  font-size:13px; padding:6px 12px; border-radius:999px; background:var(--fill);
  color:var(--text-2); transition:background var(--t-fast), color var(--t-fast);
}
.suggest button:hover{ background:var(--fill-2); color:var(--text); }

/* ─────────── PALETTE ─────────── */
#scrim{
  position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.16);
  backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
  opacity:0; pointer-events:none; transition:opacity var(--t-med) var(--e-io);
}
#scrim.on{ opacity:1; pointer-events:auto; }
@media (prefers-color-scheme: dark){ #scrim{ background:rgba(0,0,0,.42); } }
#palette{
  position:fixed; z-index:100; top:14vh; left:50%; width:min(600px,calc(100vw - 32px));
  transform:translate(-50%,-8px) scale(.97); opacity:0; pointer-events:none;
  background:var(--elev); backdrop-filter:saturate(180%) blur(40px);
  -webkit-backdrop-filter:saturate(180%) blur(40px);
  border-radius:var(--r-lg); box-shadow:var(--shadow-lg); overflow:hidden;
  transition:opacity var(--t-med) var(--e-out), transform var(--t-med) var(--e-out);
}
#palette.on{ opacity:1; transform:translate(-50%,0) scale(1); pointer-events:auto; }
.pal-in{ display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:.5px solid var(--sep); }
.pal-in svg{ width:17px; height:17px; color:var(--text-3); flex:0 0 17px; }
.pal-in input{ flex:1; font-size:17px; letter-spacing:-.018em; }
.pal-in input::placeholder{ color:var(--text-3); }
.pal-list{ max-height:min(420px,56vh); overflow-y:auto; padding:6px; }
.pal-sec{ font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  color:var(--text-3); padding:9px 12px 4px; }
.pal-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:8px 12px; border-radius:var(--r-sm); transition:background var(--t-fast);
}
.pal-item.on{ background:var(--fill-2); }
.pal-item .ico{ width:16px; height:16px; flex:0 0 16px; color:var(--text-2); }
.pal-item.on .ico{ color:var(--accent-text); }
.pal-item .m{ flex:1; min-width:0; }
.pal-item .m b{ display:block; font-size:14px; font-weight:500; letter-spacing:-.012em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pal-item .m span{ display:block; font-size:12px; color:var(--text-3);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pal-foot{ display:flex; gap:14px; padding:9px 16px; border-top:.5px solid var(--sep);
  font-size:11.5px; color:var(--text-3); }
.pal-foot span{ display:flex; align-items:center; gap:5px; }

/* ─────────── SHEET (settings / mobile detail) ─────────── */
.sheet{
  position:fixed; z-index:100; inset:auto 0 0 0; margin:0 auto;
  width:min(560px,100%); max-height:88dvh;
  background:var(--elev); backdrop-filter:saturate(180%) blur(40px);
  -webkit-backdrop-filter:saturate(180%) blur(40px);
  border-radius:var(--r-xl) var(--r-xl) 0 0; box-shadow:var(--shadow-lg);
  display:flex; flex-direction:column; overflow:hidden;
  transform:translateY(102%); transition:transform var(--t-slow) var(--e-out);
  padding-bottom:var(--safe-b);
}
.sheet.on{ transform:translateY(0); }
@media (min-width:700px){
  .sheet{ inset:auto auto 50% 50%; transform:translate(-50%,calc(50% + 12px)) scale(.98);
    border-radius:var(--r-xl); opacity:0; max-height:min(720px,84dvh); }
  .sheet.on{ transform:translate(-50%,50%) scale(1); opacity:1; }
}
.sheet-grab{ width:36px; height:5px; border-radius:3px; background:var(--fill-3); margin:8px auto 2px; }
@media (min-width:700px){ .sheet-grab{ display:none; } }
.sheet-head{ display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:.5px solid var(--sep); }
.sheet-head h2{ margin:0; flex:1; font-size:16px; font-weight:620; letter-spacing:-.022em; }
.sheet-body{ flex:1; overflow-y:auto; padding:4px 0 20px; }
.grp{ margin:20px 16px 0; }
.grp > h3{
  margin:0 0 6px 12px; font-size:11px; font-weight:600; letter-spacing:.04em;
  text-transform:uppercase; color:var(--text-3);
}
.card{ background:var(--fill); border-radius:var(--r-md); overflow:hidden; }
.row{ display:flex; align-items:center; gap:10px; padding:11px 13px; min-height:44px; }
.row + .row{ box-shadow:inset 0 .5px 0 var(--sep); }
.row .lbl{ flex:1; min-width:0; }
.row .lbl b{ display:block; font-size:14px; font-weight:450; letter-spacing:-.012em; }
.row .lbl span{ display:block; font-size:12px; color:var(--text-3); line-height:1.4; margin-top:1px; }
.row input[type=text],.row input[type=password],.row input[type=url]{
  flex:1.3; min-width:0; text-align:right; font-size:13.5px; color:var(--text-2);
  font-family:var(--font-mono); letter-spacing:-.02em;
}
.row input::placeholder{ color:var(--text-3); }
.grp .note-txt{ font-size:12px; color:var(--text-3); margin:7px 12px 0; line-height:1.5; }
.grp .note-txt a{ color:var(--accent-text); }
.switch{
  width:51px; height:31px; border-radius:999px; background:var(--fill-3); position:relative;
  flex:0 0 51px; transition:background var(--t-med) var(--e-out);
}
.switch::after{
  content:''; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%;
  background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.2);
  transition:transform var(--t-med) var(--e-out);
}
.switch.on{ background:var(--green); }
.switch.on::after{ transform:translateX(20px); }
.seg{ display:flex; background:var(--fill-2); border-radius:9px; padding:2px; gap:2px; }
.seg button{ padding:4px 11px; border-radius:7px; font-size:12.5px; font-weight:500; color:var(--text-2);
  transition:background var(--t-fast), color var(--t-fast); }
.seg button.on{ background:var(--bg); color:var(--text); box-shadow:var(--shadow-sm); }
.row.tap{ cursor:pointer; transition:background var(--t-fast); }
.row.tap:hover{ background:var(--fill-2); }
.row.danger .lbl b{ color:var(--red); }
.status-dot{ width:8px; height:8px; border-radius:50%; flex:0 0 8px; background:var(--text-3); }
.status-dot.ok{ background:var(--green); }
.status-dot.bad{ background:var(--red); }
.status-dot.warn{ background:var(--amber); }

/* ─────────── LOCK SCREEN ─────────── */
#lock{
  position:fixed; inset:0; z-index:300; display:none;
  flex-direction:column; align-items:center; justify-content:center;
  background:var(--bg); color:var(--text);
  padding:calc(var(--safe-t) + 24px) 20px calc(var(--safe-b) + 24px);
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
#lock::before{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 70% at 50% -10%, var(--fill) 0%, transparent 62%);
}
html[data-locked] #lock{ display:flex; }
html[data-locked] #app, html[data-locked] #fab,
html[data-locked] #toasts, html[data-locked] #palette, html[data-locked] .sheet{
  visibility:hidden !important;
}
/* app-switcher / tab-away privacy veil */
html[data-cover] #app, html[data-cover] #fab{ filter:blur(30px); transition:filter .18s var(--e-io); }

.lock-top{ display:flex; flex-direction:column; align-items:center; gap:0; position:relative; }
.lock-mark{
  width:52px; height:52px; border-radius:15px; margin-bottom:20px;
  background:linear-gradient(160deg,var(--text) 0%,var(--text-2) 100%);
  display:grid; place-items:center;
  animation:lockIn .6s var(--e-out) both;
}
.lock-mark svg{ width:30px; height:30px; }
@keyframes lockIn{ from{opacity:0; transform:translateY(-8px) scale(.9)} to{opacity:1;transform:none} }
.lock-title{ font-size:17px; font-weight:520; letter-spacing:-.018em; }
.lock-sub{
  font-size:13px; color:var(--text-3); margin-top:5px; min-height:18px; text-align:center;
  letter-spacing:-.01em;
}
.lock-sub.bad{ color:var(--red); }

.pin-dots{ display:flex; gap:19px; margin:26px 0 34px; position:relative; }
.pin-dots i{
  width:13px; height:13px; border-radius:50%; display:block;
  box-shadow:inset 0 0 0 1.5px var(--text-2); background:transparent;
  transition:background .18s var(--e-out), transform .18s var(--e-out), box-shadow .18s var(--e-out);
}
.pin-dots i.on{ background:var(--text); box-shadow:inset 0 0 0 1.5px var(--text); transform:scale(1.06); }
.pin-dots.shake{ animation:shake .5s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-9px)} 40%,60%{transform:translateX(9px)}
}

.keypad{
  display:grid; grid-template-columns:repeat(3,76px); gap:22px 26px;
  place-items:center; position:relative;
}
.key{
  width:76px; height:76px; border-radius:50%; background:var(--fill);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
  transition:background .12s var(--e-io), transform .12s var(--e-out);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
}
.key:active,.key.press{ background:var(--fill-3); transform:scale(.94); }
.key b{ font-size:31px; font-weight:330; letter-spacing:.01em; line-height:1; margin-top:-2px; }
.key span{ font-size:10px; font-weight:600; letter-spacing:.14em; color:var(--text-2); margin-top:3px; }
.key.blank{ background:none; pointer-events:none; }
.key.word{ background:none; font-size:15px; font-weight:450; letter-spacing:-.01em; }
.key.word:active{ background:none; opacity:.5; transform:none; }
.lock-foot{ margin-top:26px; min-height:22px; }
.lock-foot button{ font-size:14.5px; color:var(--accent-text); font-weight:450; }

@media (max-height:720px){
  .keypad{ grid-template-columns:repeat(3,66px); gap:14px 24px; }
  .key{ width:66px; height:66px; } .key b{ font-size:27px; }
  .lock-mark{ width:44px;height:44px;margin-bottom:14px;border-radius:13px; }
  .pin-dots{ margin:20px 0 26px; }
}
@media (max-height:560px){
  .lock-mark{ display:none; } .pin-dots{ margin:14px 0 18px; }
  .keypad{ gap:10px 22px; }
}

/* unlock reveal */
#lock.opening{ animation:lockOut .42s var(--e-out) forwards; }
@keyframes lockOut{ to{ opacity:0; transform:scale(1.06); } }
#app.revealing{ animation:appIn .5s var(--e-out) both; }
@keyframes appIn{ from{ opacity:0; transform:scale(.975) } to{ opacity:1; transform:none } }

/* ─── toast ─── */
#toasts{
  position:fixed; z-index:200; bottom:calc(var(--safe-b) + 20px); left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column-reverse; gap:8px; align-items:center; pointer-events:none;
}
.toast{
  display:flex; align-items:center; gap:8px; padding:9px 15px; border-radius:999px;
  background:var(--elev); backdrop-filter:saturate(180%) blur(30px);
  -webkit-backdrop-filter:saturate(180%) blur(30px);
  box-shadow:var(--shadow-md); font-size:13.5px; font-weight:480; letter-spacing:-.012em;
  animation:toastIn var(--t-slow) var(--e-out) both; white-space:nowrap;
}
.toast svg{ width:14px; height:14px; }
.toast.err{ color:var(--red); }
.toast.ok svg{ color:var(--green); }
.toast.out{ animation:toastOut var(--t-med) var(--e-io) both; }
@keyframes toastIn{ from{opacity:0; transform:translateY(14px) scale(.94)} to{opacity:1;transform:none} }
@keyframes toastOut{ to{opacity:0; transform:translateY(8px) scale(.96)} }

/* ─── spinner ─── */
.spin{ width:14px; height:14px; border-radius:50%; border:2px solid var(--fill-3);
  border-top-color:var(--text-2); animation:spin .7s linear infinite; flex:0 0 14px; }
@keyframes spin{ to{ transform:rotate(360deg) } }

/* ─── mobile FAB ─── */
#fab{
  position:fixed; z-index:60; right:calc(var(--safe-r) + 18px); bottom:calc(var(--safe-b) + 18px);
  width:54px; height:54px; border-radius:50%; background:var(--accent); color:#fff;
  display:none; place-items:center; box-shadow:0 8px 24px rgba(0,0,0,.24);
  transition:transform var(--t-fast) var(--e-out);
}
#fab:active{ transform:scale(.92); }
#fab svg{ width:23px; height:23px; }

/* ─────────── RESPONSIVE ─────────── */
@media (max-width:1100px){
  :root{ --detail-w:340px; }
}
@media (max-width:900px){
  #sidebar{
    position:fixed; z-index:80; top:0; bottom:0; left:0;
    transform:translateX(-100%); transition:transform var(--t-med) var(--e-out);
    box-shadow:var(--shadow-lg);
  }
  #sidebar.open{ transform:none; }
  #menuBtn{ display:grid; }
  #detail{
    position:fixed; z-index:85; inset:auto 0 0 0; width:100%; flex:none;
    height:88dvh; border-left:0; border-radius:var(--r-xl) var(--r-xl) 0 0;
    transform:translateY(102%); transition:transform var(--t-slow) var(--e-out);
    box-shadow:var(--shadow-lg);
  }
  #detail.open{ transform:none; }
  #detail[hidden]{ display:flex; }
  #fab{ display:grid; }
  .search-wrap{ max-width:none; }
  #capture{ padding:14px 14px 12px; }
  #list{ padding:4px 6px calc(var(--safe-b) + 100px); }
  .ask-inner,.ask-bar{ padding-left:16px; padding-right:16px; }
}
@media (max-width:700px){
  #searchKbd{ display:none; }
  .cap-hint{ display:none; }
}
@media (max-width:520px){
  .view-sub{ display:none; }
  .topbar{ padding-left:10px; padding-right:10px; }
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
.hide{ display:none !important; }

<script>
/* ═══════════════════════════════════════════════════════════════
   Trace — a place for thoughts you don't want to lose.
   Local-first. Syncs to your own Supabase. Private AI on top.
   ═══════════════════════════════════════════════════════════════ */
(() => {
'use strict';

/* ─────────────── tiny helpers ─────────────── */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random()*16|0; return (c === 'x' ? r : (r&0x3|0x8)).toString(16); }));
const now = () => new Date().toISOString();
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const IS_MAC = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent);
const MOD = IS_MAC ? '⌘' : 'Ctrl';
const modKey = e => IS_MAC ? e.metaKey : e.ctrlKey;

/* ─────────────── time formatting ─────────────── */
const DAY = 864e5;
function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function timeOf(iso){
  return new Date(iso).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
}
function dayLabel(iso){
  const d = startOfDay(iso), t = startOfDay(new Date());
  const diff = Math.round((t - d) / DAY);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7)   return new Date(iso).toLocaleDateString([], { weekday:'long' });
  if (d.getFullYear() === t.getFullYear())
    return new Date(iso).toLocaleDateString([], { weekday:'short', month:'long', day:'numeric' });
  return new Date(iso).toLocaleDateString([], { month:'long', day:'numeric', year:'numeric' });
}
function fullStamp(iso){
  return new Date(iso).toLocaleString([], {
    weekday:'long', month:'long', day:'numeric', year:'numeric',
    hour:'numeric', minute:'2-digit' });
}
function ago(iso){
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  if (s < 86400*30) return Math.floor(s/86400) + 'd ago';
  if (s < 86400*365) return Math.floor(s/(86400*30)) + 'mo ago';
  return Math.floor(s/(86400*365)) + 'y ago';
}

/* ─────────────── settings ─────────────── */
const SET_KEY = 'trace.settings.v1';
const DEFAULTS = {
  theme: 'system',
  ai:   { key:'', model:'claude-sonnet-5', enabled:true, autoEnrich:true },
  sb:   { url:'', key:'', enabled:false, lastPull:'' },
  enterSaves: false,
  deviceName: '',
};
let S = load();
function load(){
  try {
    const raw = JSON.parse(localStorage.getItem(SET_KEY) || '{}');
    return { ...DEFAULTS, ...raw,
      ai:{ ...DEFAULTS.ai, ...(raw.ai||{}) },
      sb:{ ...DEFAULTS.sb, ...(raw.sb||{}) } };
  } catch { return structuredClone(DEFAULTS); }
}
function saveSettings(){ localStorage.setItem(SET_KEY, JSON.stringify(S)); }
if (!S.deviceName){
  S.deviceName = /iPhone/.test(navigator.userAgent) ? 'iPhone'
    : /iPad/.test(navigator.userAgent) ? 'iPad'
    : /Mac/.test(navigator.userAgent) ? 'Mac' : 'Browser';
  saveSettings();
}

/* ─────────────── IndexedDB store ─────────────── */
const DB_NAME = 'trace', DB_VER = 1, STORE = 'notes';
let _db = null;
function db(){
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const rq = indexedDB.open(DB_NAME, DB_VER);
    rq.onupgradeneeded = () => {
      const d = rq.result;
      if (!d.objectStoreNames.contains(STORE)){
        const s = d.createObjectStore(STORE, { keyPath:'id' });
        s.createIndex('created_at', 'created_at');
        s.createIndex('updated_at', 'updated_at');
      }
    };
    rq.onsuccess = () => { _db = rq.result; res(_db); };
    rq.onerror = () => rej(rq.error);
  });
}
async function tx(mode, fn){
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(STORE, mode);
    const s = t.objectStore(STORE);
    let out;
    try { out = fn(s); } catch(e){ rej(e); return; }
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    t.onerror = () => rej(t.error);
  });
}
const Store = {
  all(){ return tx('readonly', s => s.getAll()).then(r => r || []); },
  put(n){ return tx('readwrite', s => s.put(n)); },
  putMany(list){ return tx('readwrite', s => { list.forEach(n => s.put(n)); }); },
  del(id){ return tx('readwrite', s => s.delete(id)); },
};

/* ─────────────── app state ─────────────── */
const A = {
  notes: [],           // in-memory mirror, newest first
  view: 'all',         // all | today | starred | archive | trash | ask | tag
  tag: null,
  query: '',
  selected: null,      // note id
  thread: [],          // ask conversation
  busy: false,
  syncing: false,
  syncErr: '',
  palOpen: false,
  palIdx: 0,
  palItems: [],
};
const byId = id => A.notes.find(n => n.id === id);
function resort(){ A.notes.sort((a,b) => (b.created_at < a.created_at ? -1 : b.created_at > a.created_at ? 1 : 0)); }

/* ─────────────── toasts ─────────────── */
function toast(msg, kind = ''){
  const t = el('div', 'toast ' + kind);
  if (kind === 'ok')  t.innerHTML = '<svg><use href="#i-check"/></svg>';
  if (kind === 'busy') t.innerHTML = '<span class="spin"></span>';
  t.appendChild(el('span', null, msg));
  $('#toasts').appendChild(t);
  const kill = () => { t.classList.add('out'); setTimeout(() => t.remove(), 320); };
  const timer = setTimeout(kill, kind === 'err' ? 5200 : 2400);
  return () => { clearTimeout(timer); kill(); };
}

/* ─────────────── text utilities ─────────────── */
const STOP = new Set(('a an and are as at be but by for from has have he her his i if in is it its me my of on or she so that the their them then there these they this to was we were what when which who will with you your'.split(' ')));
function tokens(str){
  return (str || '').toLowerCase().replace(/[^\p{L}\p{N}\s#]/gu, ' ')
    .split(/\s+/).filter(w => w.length > 2 && !STOP.has(w));
}
function derivedTitle(body){
  const line = (body || '').trim().split('\n').find(l => l.trim()) || '';
  const clean = line.replace(/^#+\s*/, '').trim();
  /* no ellipsis baked in — the list clamps visually, the detail view wraps */
  return (clean.length > 160 ? clean.slice(0, 158).trimEnd() + '…' : clean) || 'Untitled';
}
function extractHashtags(body){
  return [...new Set((body.match(/(?:^|\s)#([\p{L}\p{N}_-]{2,24})/gu) || [])
    .map(t => t.trim().slice(1).toLowerCase()))];
}
/* similarity for "related notes" — no API needed */
function vec(n){
  const m = new Map();
  tokens((n.title || '') + ' ' + n.body + ' ' + (n.tags || []).join(' ')).forEach(w => m.set(w, (m.get(w)||0)+1));
  return m;
}
function cosine(a, b){
  let dot = 0, na = 0, nb = 0;
  a.forEach(v => na += v*v);
  b.forEach(v => nb += v*v);
  a.forEach((v, k) => { const o = b.get(k); if (o) dot += v*o; });
  return (na && nb) ? dot / Math.sqrt(na*nb) : 0;
}
function related(note, limit = 4){
  const v = vec(note);
  return A.notes
    .filter(n => n.id !== note.id && !n.deleted_at)
    .map(n => ({ n, s: cosine(v, vec(n)) }))
    .filter(x => x.s > 0.15)
    .sort((a,b) => b.s - a.s).slice(0, limit);
}
/* search scoring + highlight */
function matches(n, q){
  if (!q) return true;
  const hay = ((n.title||'') + ' ' + n.body + ' ' + (n.tags||[]).join(' ')).toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t));
}
function hl(text, q){
  const s = esc(text);
  if (!q) return s;
  const terms = q.split(/\s+/).filter(t => t.length > 1).map(t => t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if (!terms.length) return s;
  return s.replace(new RegExp('(' + terms.join('|') + ')', 'gi'), '<mark>$1</mark>');
}

/* ═══════════════ MUTATIONS ═══════════════ */
async function createNote(body, opts = {}){
  const t = now();
  const n = {
    id: uid(),
    body: body.trim(),
    title: derivedTitle(body),
    tags: extractHashtags(body),
    starred: false,
    archived: false,
    deleted_at: null,
    created_at: opts.created_at || t,
    updated_at: t,
    device: S.deviceName,
    ai: null,
    _dirty: true,
    _aiTitle: false,
  };
  A.notes.unshift(n);
  await Store.put(n);
  render();
  queueSync();
  if (S.ai.enabled && S.ai.autoEnrich && S.ai.key) enrich(n, { quiet:true });
  return n;
}
async function patch(id, changes, opts = {}){
  const n = byId(id); if (!n) return;
  Object.assign(n, changes);
  if (!opts.silent) n.updated_at = now();
  n._dirty = true;
  await Store.put(n);
  if (!opts.noRender) render();
  queueSync();
  return n;
}
async function hardDelete(id){
  A.notes = A.notes.filter(n => n.id !== id);
  await Store.del(id);
  render();
}

/* ═══════════════ SUPABASE SYNC ═══════════════ */
const SYNC_COLS = ['id','body','title','tags','starred','archived','deleted_at','created_at','updated_at','device','ai'];
const wire = n => Object.fromEntries(SYNC_COLS.map(k => [k, n[k] ?? null]));

function sbReady(){ return S.sb.enabled && /^https?:\/\//.test(S.sb.url) && S.sb.key.length > 10; }
function sbUrl(path){ return S.sb.url.replace(/\/+$/,'') + '/rest/v1' + path; }
function sbHeaders(extra = {}){
  return { apikey:S.sb.key, Authorization:'Bearer ' + S.sb.key,
           'Content-Type':'application/json', ...extra };
}
async function sbFetch(path, init = {}){
  const res = await fetch(sbUrl(path), { ...init, headers: sbHeaders(init.headers) });
  if (!res.ok) throw new Error((await res.text()).slice(0, 300) || res.status);
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

const queueSync = debounce(() => sync(), 1400);
let syncTimer = null;

async function sync(opts = {}){
  if (!sbReady() || A.syncing) return;
  A.syncing = true; A.syncErr = ''; paintSyncDot();
  try {
    /* push local changes */
    const dirty = A.notes.filter(n => n._dirty);
    if (dirty.length){
      for (let i = 0; i < dirty.length; i += 40){
        const batch = dirty.slice(i, i+40).map(wire);
        await sbFetch('/notes', {
          method:'POST',
          headers:{ Prefer:'resolution=merge-duplicates,return=minimal' },
          body: JSON.stringify(batch),
        });
      }
      dirty.forEach(n => n._dirty = false);
      await Store.putMany(dirty);
    }
    /* pull remote changes */
    const since = S.sb.lastPull || '1970-01-01T00:00:00Z';
    const remote = await sbFetch(
      `/notes?select=*&updated_at=gt.${encodeURIComponent(since)}&order=updated_at.asc&limit=2000`) || [];
    let changed = 0, newest = since;
    const toStore = [];
    for (const r of remote){
      if (r.updated_at > newest) newest = r.updated_at;
      const local = byId(r.id);
      if (!local){
        const n = { ...r, tags: r.tags || [], _dirty:false };
        A.notes.push(n); toStore.push(n); changed++;
      } else if (r.updated_at > local.updated_at){
        Object.assign(local, r, { tags: r.tags || [], _dirty:false });
        toStore.push(local); changed++;
      }
    }
    if (toStore.length) await Store.putMany(toStore);
    S.sb.lastPull = newest; saveSettings();
    if (changed){ resort(); render(); }
    if (opts.loud) toast(
      dirty.length || changed
        ? `Synced · ${dirty.length} up, ${changed} down`
        : 'Everything up to date', 'ok');
  } catch (e){
    A.syncErr = String(e.message || e);
    if (opts.loud) toast('Sync failed — ' + A.syncErr.slice(0,90), 'err');
  } finally {
    A.syncing = false; paintSyncDot();
  }
}
function startSyncLoop(){
  clearInterval(syncTimer);
  if (sbReady()) syncTimer = setInterval(() => sync(), 60000);
}
function paintSyncDot(){
  const d = $('#syncDot'); if (!d) return;
  d.className = 'status-dot ' + (!sbReady() ? '' : A.syncErr ? 'bad' : A.syncing ? 'warn' : 'ok');
  d.title = !sbReady() ? 'Sync off — notes stay on this device'
          : A.syncErr ? 'Sync error: ' + A.syncErr
          : A.syncing ? 'Syncing…' : 'Synced with your server';
}

/* ═══════════════ CLAUDE ═══════════════ */
const AI_URL = 'https://api.anthropic.com/v1/messages';
function aiReady(){ return S.ai.enabled && S.ai.key.trim().length > 10; }

async function claude({ system, messages, max_tokens = 1024, temperature = 1, stream = false, onDelta, prefill }){
  if (!aiReady()) throw new Error('No API key set. Open Settings → Intelligence.');
  const msgs = [...messages];
  if (prefill) msgs.push({ role:'assistant', content: prefill });
  const res = await fetch(AI_URL, {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': S.ai.key.trim(),
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body: JSON.stringify({ model:S.ai.model || 'claude-sonnet-5', max_tokens, temperature, system, messages: msgs, stream }),
  });
  if (!res.ok){
    let m = await res.text();
    try { m = JSON.parse(m).error?.message || m; } catch {}
    if (res.status === 401) m = 'API key rejected. Check it in Settings.';
    if (res.status === 429) m = 'Rate limited by Anthropic — try again in a moment.';
    if (res.status === 404) m = `Model "${S.ai.model}" not found. Change it in Settings → Intelligence.`;
    throw new Error(m.slice(0, 220));
  }
  if (!stream){
    const j = await res.json();
    return (prefill || '') + (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  }
  /* streamed */
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', out = prefill || '';
  if (prefill && onDelta) onDelta(prefill, out);
  for (;;){
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream:true });
    const parts = buf.split('\n\n'); buf = parts.pop();
    for (const p of parts){
      const line = p.split('\n').find(l => l.startsWith('data: '));
      if (!line) continue;
      try {
        const ev = JSON.parse(line.slice(6));
        if (ev.type === 'content_block_delta' && ev.delta?.text){
          out += ev.delta.text;
          onDelta && onDelta(ev.delta.text, out);
        }
      } catch {}
    }
  }
  return out;
}
function grabJSON(txt){
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  if (a === -1 || b === -1) throw new Error('Bad AI response');
  return JSON.parse(txt.slice(a, b+1));
}

/* ── auto-enrich a note: title, tags, one-line gist ── */
async function enrich(note, { quiet } = {}){
  if (!aiReady()) { if (!quiet) toast('Add your API key in Settings first', 'err'); return; }
  const clear = quiet ? null : toast('Analysing…', 'busy');
  try {
    const vocab = [...new Set(A.notes.flatMap(n => n.tags || []))].slice(0, 60);
    const out = await claude({
      max_tokens: 500, temperature: 0.3,
      system:
`You label a person's private captured thoughts. Be precise and plain — never inflate a scrappy note into something grand.
Return ONLY JSON: {"title": string, "tags": string[], "gist": string, "kind": string}
- title: max 8 words, plain, the note's actual subject. No colons-and-subtitles, no title case, no invented specificity.
- tags: 1-4 lowercase single words or hyphenated pairs. Reuse from the existing vocabulary when a good fit; invent only when needed.
- gist: one sentence, max 22 words, stating what this note is really about or what it's asking for. If the note is trivially short, just restate it.
- kind: one of idea, task, question, observation, reminder, feeling, reference, decision.
Existing tag vocabulary: ${vocab.join(', ') || '(none yet)'}`,
      messages:[{ role:'user', content: note.body.slice(0, 6000) }],
      prefill: '{"title":',
    });
    const j = grabJSON(out);
    const tags = [...new Set([
      ...extractHashtags(note.body),
      ...(j.tags || []).map(t => String(t).toLowerCase().replace(/^#/, '').trim()).filter(Boolean),
    ])].slice(0, 6);
    await patch(note.id, {
      title: (j.title || note.title).trim(),
      tags,
      ai: { gist: j.gist || '', kind: j.kind || '', at: now() },
      _aiTitle: true,
    }, { silent: quiet });
    clear && clear();
    if (!quiet) toast('Analysed', 'ok');
  } catch (e){
    clear && clear();
    if (!quiet) toast(String(e.message || e), 'err');
    else console.warn('[trace] enrich failed:', e);
  }
}

/* ── build context for questions ── */
function contextFor(question, budget = 90000){
  const live = A.notes.filter(n => !n.deleted_at && !n.archived);
  const q = tokens(question);
  const scored = live.map(n => {
    const t = tokens((n.title||'') + ' ' + n.body + ' ' + (n.tags||[]).join(' '));
    const set = new Set(t);
    let overlap = 0; q.forEach(w => { if (set.has(w)) overlap++; });
    const recency = 1 / (1 + (Date.now() - new Date(n.created_at)) / (DAY * 45));
    return { n, s: overlap * 2 + recency };
  }).sort((a,b) => b.s - a.s);

  const picked = []; let size = 0;
  for (const { n } of scored){
    const blob = `[${n.id.slice(0,8)}] ${new Date(n.created_at).toLocaleString()} `
      + `${(n.tags||[]).map(t=>'#'+t).join(' ')}\n${n.body}\n`;
    if (size + blob.length > budget) break;
    picked.push({ n, blob }); size += blob.length;
  }
  picked.sort((a,b) => a.n.created_at < b.n.created_at ? -1 : 1);
  return { text: picked.map(p => p.blob).join('\n---\n'), notes: picked.map(p => p.n) };
}

/* ═══════════════ light markdown ═══════════════ */
function md(t){
  let s = esc(t);
  s = s.replace(/`([^`\n]+)`/g, '<code style="font-family:var(--font-mono);font-size:.9em;background:var(--fill);padding:1px 5px;border-radius:5px">$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong style="font-weight:600">$1</strong>');
  s = s.replace(/^###\s+(.+)$/gm, '<div style="font-weight:600;margin:16px 0 4px;letter-spacing:-.015em">$1</div>');
  s = s.replace(/^##\s+(.+)$/gm, '<div style="font-weight:640;font-size:1.06em;margin:18px 0 5px;letter-spacing:-.02em">$1</div>');
  s = s.replace(/^\s*[-*•]\s+(.+)$/gm, '<div style="display:flex;gap:9px;margin:3px 0"><span style="color:var(--text-3)">•</span><span>$1</span></div>');
  s = s.replace(/^\s*(\d+)\.\s+(.+)$/gm, '<div style="display:flex;gap:9px;margin:3px 0"><span style="color:var(--text-3);font-variant-numeric:tabular-nums">$1.</span><span>$2</span></div>');
  return s;
}

/* ═══════════════ filtering ═══════════════ */
function visible(){
  const q = A.query.trim();
  let list = A.notes;
  switch (A.view){
    case 'trash':   list = list.filter(n => n.deleted_at); break;
    case 'archive': list = list.filter(n => n.archived && !n.deleted_at); break;
    case 'today': {
      const t = startOfDay(new Date()).toISOString();
      list = list.filter(n => !n.deleted_at && !n.archived && n.created_at >= t); break;
    }
    case 'starred': list = list.filter(n => n.starred && !n.deleted_at); break;
    case 'tag':     list = list.filter(n => !n.deleted_at && (n.tags||[]).includes(A.tag)); break;
    default:        list = list.filter(n => !n.deleted_at && !n.archived);
  }
  return q ? list.filter(n => matches(n, q)) : list;
}

/* ═══════════════ sidebar ═══════════════ */
function navBtn({ icon, label, count, active, onClick, dot }){
  const b = el('button', 'nav-item' + (active ? ' active' : ''));
  b.innerHTML = `<svg class="ico"><use href="#${icon}"/></svg>`;
  b.appendChild(el('span', 'lbl', label));
  if (dot){ const d = el('span','dot'); d.style.background = dot; b.appendChild(d); }
  if (count != null && count > 0) b.appendChild(el('span', 'cnt', String(count)));
  b.onclick = onClick;
  return b;
}
function paintNav(){
  const live = A.notes.filter(n => !n.deleted_at && !n.archived);
  const t0 = startOfDay(new Date()).toISOString();
  const main = $('#navMain'); main.innerHTML = '';
  const go = v => () => { A.view = v; A.tag = null; A.query = ''; $('#searchInput').value=''; closeSidebar(); render(); };
  main.appendChild(navBtn({ icon:'i-inbox',   label:'All Notes', count:live.length, active:A.view==='all',     onClick:go('all') }));
  main.appendChild(navBtn({ icon:'i-today',   label:'Today',     count:live.filter(n=>n.created_at>=t0).length, active:A.view==='today', onClick:go('today') }));
  main.appendChild(navBtn({ icon:'i-star',    label:'Starred',   count:A.notes.filter(n=>n.starred&&!n.deleted_at).length, active:A.view==='starred', onClick:go('starred') }));
  main.appendChild(navBtn({ icon:'i-archive', label:'Archive',   count:A.notes.filter(n=>n.archived&&!n.deleted_at).length, active:A.view==='archive', onClick:go('archive') }));
  main.appendChild(navBtn({ icon:'i-trash',   label:'Trash',     count:A.notes.filter(n=>n.deleted_at).length, active:A.view==='trash', onClick:go('trash') }));

  const ai = $('#navAI'); ai.innerHTML = '';
  ai.appendChild(el('div','nav-label','Intelligence'));
  ai.appendChild(navBtn({ icon:'i-ask',     label:'Ask Trace', active:A.view==='ask', onClick:() => { openAsk(); closeSidebar(); } }));
  ai.appendChild(navBtn({ icon:'i-digest',  label:'Digest',    onClick:() => { closeSidebar(); runDigest(7); } }));
  ai.appendChild(navBtn({ icon:'i-shuffle', label:'Resurface', onClick:() => { closeSidebar(); resurface(); } }));

  const counts = new Map();
  live.forEach(n => (n.tags||[]).forEach(t => counts.set(t, (counts.get(t)||0)+1)));
  const tags = [...counts.entries()].sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0])).slice(0, 24);
  const tg = $('#navTags'); tg.innerHTML = '';
  if (tags.length){
    tg.appendChild(el('div','nav-label','Tags'));
    tags.forEach(([t, c]) => tg.appendChild(navBtn({
      icon:'i-tag', label:t, count:c, active:A.view==='tag' && A.tag===t,
      onClick:() => { A.view='tag'; A.tag=t; closeSidebar(); render(); }
    })));
  }
}

/* ═══════════════ note list ═══════════════ */
function noteCard(n){
  const b = el('button', 'note' + (A.selected === n.id ? ' sel' : ''));
  b.dataset.id = n.id;
  const top = el('div', 'note-top');
  const ttl = el('div', 'note-title');
  ttl.innerHTML = hl(n.title || derivedTitle(n.body), A.query);
  top.appendChild(ttl);
  if (n.starred){ const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('class','star'); s.innerHTML = '<use href="#i-star-f"/>'; top.appendChild(s); }
  const tm = el('div', 'note-time', timeOf(n.created_at)); top.appendChild(tm);
  b.appendChild(top);

  const rest = n.body.trim();
  const firstLine = rest.split('\n')[0] || '';
  /* if the title was derived from the opening line, don't repeat that line below it */
  const derived = !n._aiTitle && derivedTitle(n.body) === (n.title || '');
  const preview = derived ? rest.slice(firstLine.length).trim() : rest;
  if (preview){
    const bd = el('div', 'note-body');
    bd.innerHTML = hl(preview.slice(0, 260), A.query);
    b.appendChild(bd);
  }
  const tags = n.tags || [];
  if (tags.length){
    const m = el('div', 'note-meta');
    tags.slice(0,5).forEach(t => m.appendChild(el('span','tag','#'+t)));
    b.appendChild(m);
  }
  b.onclick = () => selectNote(n.id);
  return b;
}
function renderList(){
  const wrap = $('#list'); wrap.innerHTML = '';
  const list = visible();
  $('#viewTitle').textContent = A.view === 'tag' ? '#' + A.tag : VIEWS[A.view].title;
  $('#viewSub').textContent = A.query
    ? `${list.length} result${list.length===1?'':'s'}`
    : list.length ? `${list.length} note${list.length===1?'':'s'}` : '';

  if (!list.length){
    const e = el('div','empty');
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.innerHTML = `<use href="#${A.query ? 'i-search' : VIEWS[A.view]?.icon || 'i-inbox'}"/>`;
    svg.setAttribute('fill','none'); svg.setAttribute('stroke','currentColor');
    e.appendChild(svg);
    if (A.query){
      e.appendChild(el('h4','','No matches'));
      e.appendChild(el('p','',`Nothing in ${A.view === 'all' ? 'your notes' : VIEWS[A.view]?.title || 'this view'} contains “${A.query}”.`));
    } else if (A.view === 'all'){
      e.appendChild(el('h4','','Nothing here yet'));
      e.appendChild(el('p','','Type the thought above and press ' + MOD + '↵. It gets a timestamp and stays forever.'));
    } else if (A.view === 'trash'){
      e.appendChild(el('h4','','Trash is empty'));
      e.appendChild(el('p','','Deleted notes stay here until you empty the trash. Nothing disappears on its own.'));
    } else {
      e.appendChild(el('h4','','Nothing in ' + (A.view==='tag' ? '#'+A.tag : VIEWS[A.view].title)));
      e.appendChild(el('p','','It fills up as you capture.'));
    }
    wrap.appendChild(e);
    return;
  }
  let day = '';
  list.forEach((n, i) => {
    const d = dayLabel(n.created_at);
    if (d !== day){
      day = d;
      const h = el('div','day-head');
      h.appendChild(el('h3','',d));
      h.appendChild(el('span','', new Date(n.created_at).toLocaleDateString([], { month:'short', day:'numeric' })));
      wrap.appendChild(h);
    }
    const c = noteCard(n);
    c.style.animationDelay = Math.min(i, 12) * 14 + 'ms';
    wrap.appendChild(c);
  });
}

/* ═══════════════ detail pane ═══════════════ */
function selectNote(id){
  A.selected = id;
  $('#detail').hidden = false;
  $('#detail').classList.add('open');
  render();
  $('#dScroll').scrollTop = 0;
}
function closeDetail(){
  A.selected = null;
  $('#detail').classList.remove('open');
  $('#detail').hidden = true;
  render();
}
function sec(label, icon){
  const s = el('div','d-sec');
  const h = el('div','d-sec-h');
  h.innerHTML = `<svg><use href="#${icon}"/></svg>`;
  h.appendChild(el('span','',label));
  h.appendChild(el('span','grow'));
  s.appendChild(h);
  return s;
}
function paintDetail(){
  const d = $('#detail');
  const n = A.selected ? byId(A.selected) : null;
  if (!n){ d.hidden = true; d.classList.remove('open'); return; }
  d.hidden = false;

  $('#dStar').classList.toggle('on', !!n.starred);
  $('#dStar').firstElementChild.innerHTML = `<use href="#${n.starred ? 'i-star-f' : 'i-star'}"/>`;
  $('#dArchive').classList.toggle('on', !!n.archived);
  $('#dEnrich').classList.toggle('hide', !aiReady());

  const s = $('#dScroll'); s.innerHTML = '';

  const t = el('h2','d-title', n.title || derivedTitle(n.body));
  t.contentEditable = 'plaintext-only'; t.spellcheck = false;
  t.onblur = () => { const v = t.textContent.trim(); if (v && v !== n.title) patch(n.id, { title:v, _aiTitle:false }); };
  t.onkeydown = ev => { if (ev.key === 'Enter'){ ev.preventDefault(); t.blur(); } };
  s.appendChild(t);

  const st = el('div','d-stamp');
  st.innerHTML = `${esc(fullStamp(n.created_at))} · <span title="${esc(fullStamp(n.updated_at))}">${esc(ago(n.created_at))}</span>`
    + (n.device ? ` · ${esc(n.device)}` : '');
  s.appendChild(st);

  const body = el('textarea','d-body');
  body.value = n.body; body.rows = 1;
  const grow = () => { body.style.height='auto'; body.style.height = body.scrollHeight + 'px'; };
  body.oninput = grow;
  body.onblur = () => {
    const v = body.value;
    if (v !== n.body) patch(n.id, { body:v, tags:[...new Set([...(n.tags||[]), ...extractHashtags(v)])] });
  };
  s.appendChild(body);
  requestAnimationFrame(grow);

  if (n.ai?.gist){
    const g = sec('What this is', 'i-spark');
    const c = el('div','ai-card');
    c.innerHTML = (n.ai.kind ? `<strong>${esc(n.ai.kind[0].toUpperCase()+n.ai.kind.slice(1))}.</strong> ` : '') + esc(n.ai.gist);
    g.appendChild(c); s.appendChild(g);
  }

  const tg = sec('Tags', 'i-tag');
  const chips = el('div','chips');
  (n.tags||[]).forEach(tag => {
    const c = el('button','chip','#'+tag);
    c.title = 'Filter by #' + tag + ' · shift-click to remove';
    c.onclick = ev => {
      if (ev.shiftKey){ patch(n.id, { tags:(n.tags||[]).filter(x=>x!==tag) }); return; }
      A.view='tag'; A.tag=tag; render();
    };
    chips.appendChild(c);
  });
  const add = el('button','chip add','+ tag');
  add.onclick = () => {
    const v = prompt('Add a tag'); if (!v) return;
    patch(n.id, { tags:[...new Set([...(n.tags||[]), v.toLowerCase().replace(/^#/,'').trim()])] });
  };
  chips.appendChild(add); tg.appendChild(chips); s.appendChild(tg);

  const rel = related(n);
  if (rel.length){
    const r = sec('Related', 'i-link');
    rel.forEach(({ n:o, s:score }) => {
      const b = el('button','link-note');
      b.appendChild(el('span','t', o.title || derivedTitle(o.body)));
      b.appendChild(el('span','s', `${dayLabel(o.created_at)} · ${Math.round(score*100)}% similar`));
      b.onclick = () => selectNote(o.id);
      r.appendChild(b);
    });
    s.appendChild(r);
  }

  const act = sec('Actions', 'i-spark');
  const row = el('div','chips');
  if (aiReady()){
    const ask = el('button','btn sm','Ask about this');
    ask.onclick = () => { openAsk(); $('#askInput').value = `About my note "${n.title}": `; $('#askInput').focus(); };
    row.appendChild(ask);
    const exp = el('button','btn sm','Expand it');
    exp.onclick = () => expandNote(n);
    row.appendChild(exp);
  }
  const cp = el('button','btn sm','Copy');
  cp.onclick = async () => { await navigator.clipboard.writeText(n.body); toast('Copied','ok'); };
  row.appendChild(cp);
  if (n.deleted_at){
    const rs = el('button','btn sm','Restore');
    rs.onclick = () => { patch(n.id, { deleted_at:null }); toast('Restored','ok'); };
    row.appendChild(rs);
    const fd = el('button','btn sm','Delete forever');
    fd.onclick = () => { if (confirm('Permanently delete this note? This cannot be undone.')) { hardDelete(n.id); closeDetail(); } };
    row.appendChild(fd);
  }
  act.appendChild(row); s.appendChild(act);
}

/* ═══════════════ master render ═══════════════ */
function render(){
  paintNav();
  const asking = A.view === 'ask';
  $('#askView').hidden = !asking;
  $('#capture').classList.toggle('hide', asking);
  $('#listScroll').classList.toggle('hide', asking);
  $('#searchWrap').classList.toggle('hide', asking);
  if (asking){
    $('#viewTitle').textContent = 'Ask Trace';
    const live = A.notes.filter(n => !n.deleted_at).length;
    $('#viewSub').textContent = `across ${live} note${live===1?'':'s'}`;
  } else {
    renderList();
  }
  paintDetail();
  paintSyncDot();
}

/* ═══════════════ ASK ═══════════════ */
function openAsk(){
  A.view = 'ask'; render();
  if (!A.thread.length) paintThread();
  setTimeout(() => { if (window.innerWidth > 900) $('#askInput').focus(); }, 60);
}

function msgNode(role, text, cites){
  const m = el('div', 'msg ' + (role === 'user' ? 'me' : 'ai'));
  const who = el('div','who');
  who.innerHTML = role === 'user'
    ? '<span>You</span>'
    : '<svg><use href="#i-spark"/></svg><span>Trace</span>';
  m.appendChild(who);
  const t = el('div','txt');
  if (role === 'user') t.textContent = text; else t.innerHTML = md(text || '');
  m.appendChild(t);
  if (cites?.length){
    const c = el('div','cites');
    cites.slice(0,6).forEach(n => {
      const b = el('button','cite', n.title || derivedTitle(n.body));
      b.title = fullStamp(n.created_at);
      b.onclick = () => selectNote(n.id);
      c.appendChild(b);
    });
    m.appendChild(c);
  }
  return m;
}
function askSuggestions(){
  const wrap = el('div','msg');
  const w = el('div','who'); w.innerHTML = '<svg><use href="#i-spark"/></svg><span>Trace</span>';
  wrap.appendChild(w);
  const t = el('div','txt');
  const n = A.notes.filter(x => !x.deleted_at).length;
  t.textContent = n
    ? `I've read all ${n} of your notes. Ask me anything about them — I'll answer only from what's actually in there.`
    : `Nothing captured yet. Once you've saved a few thoughts, I can search them, connect them, and tell you what you keep circling back to.`;
  wrap.appendChild(t);
  const sug = el('div','suggest');
  ['What have I been thinking about lately?',
   'What ideas have I written down but never acted on?',
   'Find contradictions in my notes',
   'What themes keep coming up?',
   'Summarise this week'].forEach(q => {
    const b = el('button', null, q);
    b.onclick = () => { $('#askInput').value = q; doAsk(); };
    sug.appendChild(b);
  });
  wrap.appendChild(sug);
  return wrap;
}
function paintThread(){
  const th = $('#askThread'); th.innerHTML = '';
  if (!A.thread.length){ th.appendChild(askSuggestions()); return; }
  A.thread.forEach(m => th.appendChild(msgNode(m.role, m.text, m.cites)));
}
function scrollAsk(){ const s = $('#askScroll'); s.scrollTop = s.scrollHeight; }

async function doAsk(preset){
  const input = $('#askInput');
  const q = (preset || input.value).trim();
  if (!q || A.busy) return;
  if (!aiReady()){ toast('Add your Anthropic API key in Settings first','err'); openSettings(); return; }
  input.value = ''; input.style.height = 'auto';
  A.thread.push({ role:'user', text:q });
  paintThread(); scrollAsk();

  const { text: ctx, notes: used } = contextFor(q);
  const node = msgNode('assistant', '');
  const txtEl = node.querySelector('.txt');
  txtEl.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  $('#askThread').appendChild(node); scrollAsk();

  A.busy = true;
  let first = true;
  try {
    const answer = await claude({
      max_tokens: 2000, temperature: 0.6, stream: true,
      system:
`You are the intelligence inside Trace, a private note vault belonging to one person. You have been given their captured notes below.

Rules:
- Answer ONLY from the notes. If they don't contain the answer, say so plainly in one line and stop. Never invent a note.
- Quote their own words when it helps. Reference notes by their opening words, not by ID.
- Be direct and specific. No preamble, no "great question", no summarising the question back.
- Short answers when short is right. This person values their time.
- When you spot a pattern, a contradiction, or something they wrote and never returned to, say it — that's the whole point of you.
- Today is ${new Date().toDateString()}.

THEIR NOTES:
${ctx || '(no notes captured yet)'}`,
      messages: A.thread.slice(-8).map(m => ({ role:m.role, content:m.text })),
      onDelta: (_d, full) => {
        if (first){ first = false; }
        txtEl.innerHTML = md(full);
        scrollAsk();
      },
    });
    A.thread.push({ role:'assistant', text:answer, cites:used.slice(0,6) });
    paintThread(); scrollAsk();
  } catch (e){
    txtEl.innerHTML = `<span style="color:var(--red)">${esc(String(e.message||e))}</span>`;
    A.thread.push({ role:'assistant', text:'⚠︎ ' + String(e.message||e) });
  } finally { A.busy = false; }
}

/* ═══════════════ DIGEST ═══════════════ */
async function runDigest(days){
  if (!aiReady()){ toast('Add your Anthropic API key in Settings first','err'); openSettings(); return; }
  const since = new Date(Date.now() - days*DAY).toISOString();
  const set = A.notes.filter(n => !n.deleted_at && n.created_at >= since);
  if (!set.length){ toast(`Nothing captured in the last ${days} days`); return; }
  openAsk();
  A.thread.push({ role:'user', text:`Digest — the last ${days} days (${set.length} notes)` });
  paintThread();
  const node = msgNode('assistant','');
  const txtEl = node.querySelector('.txt');
  txtEl.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  $('#askThread').appendChild(node); scrollAsk();
  const blob = set.slice().reverse().map(n =>
    `${new Date(n.created_at).toLocaleString()} ${(n.tags||[]).map(t=>'#'+t).join(' ')}\n${n.body}`).join('\n---\n');
  try {
    const out = await claude({
      max_tokens: 1600, temperature: 0.7, stream: true,
      system:
`You write a private weekly read-back for one person, from their own captured notes. You are not a summariser — you are the friend who noticed things.

Structure it exactly like this, no other headings:
## The thread
Two or three sentences on what they were actually preoccupied with. Name it plainly.
## Worth pulling on
2-4 bullets. Specific notes that deserve a second look, and why. Quote their words.
## Left hanging
Anything they wrote as an intention or question and never came back to. If nothing, say "Nothing dangling."
## One thing
A single concrete suggestion for the coming week, drawn from what's actually here. Not generic advice.

Never flatter. Never pad. If the week was thin, say the week was thin.`,
      messages:[{ role:'user', content: blob.slice(0, 120000) }],
      onDelta: (_d, full) => { txtEl.innerHTML = md(full); scrollAsk(); },
    });
    A.thread.push({ role:'assistant', text:out, cites:set.slice(0,6) });
    paintThread(); scrollAsk();
  } catch (e){
    txtEl.innerHTML = `<span style="color:var(--red)">${esc(String(e.message||e))}</span>`;
  }
}

/* ═══════════════ RESURFACE ═══════════════ */
function resurface(){
  const pool = A.notes.filter(n => !n.deleted_at && Date.now() - new Date(n.created_at) > DAY*3);
  const src = pool.length ? pool : A.notes.filter(n => !n.deleted_at);
  if (!src.length){ toast('Nothing to resurface yet'); return; }
  const pick = src[Math.floor(Math.random() * src.length)];
  A.view = 'all'; A.query = ''; $('#searchInput').value = '';
  selectNote(pick.id);
  toast('From ' + dayLabel(pick.created_at).toLowerCase());
}

/* ═══════════════ EXPAND ═══════════════ */
async function expandNote(n){
  if (!aiReady()){ toast('Add your API key in Settings first','err'); return; }
  const clear = toast('Thinking…','busy');
  try {
    const out = await claude({
      max_tokens: 900, temperature: 0.8,
      system:`The person wrote a quick note to themselves. Develop it — don't just restate it.
Give: what they were probably reaching for, 2-3 concrete next moves, and one honest risk or objection.
Under 180 words. Plain sentences. No headings, no flattery, no bullet-point soup.`,
      messages:[{ role:'user', content:n.body }],
    });
    clear();
    openAsk();
    A.thread.push({ role:'user', text:`Expand: ${n.title || derivedTitle(n.body)}` });
    A.thread.push({ role:'assistant', text:out, cites:[n] });
    paintThread(); scrollAsk();
  } catch (e){ clear(); toast(String(e.message||e),'err'); }
}

function palRender(){
  const q = $('#palInput').value.trim();
  const list = $('#palList'); list.innerHTML = '';
  A.palItems = [];

  const cmds = commands().filter(c => !q || c.label.toLowerCase().includes(q.toLowerCase()));
  if (cmds.length){
    list.appendChild(el('div','pal-sec', q ? 'Commands' : 'Actions'));
    cmds.slice(0, q ? 6 : 13).forEach(c => A.palItems.push({ ...c, kind:'cmd' }));
  }
  if (q){
    const hits = A.notes.filter(n => !n.deleted_at && matches(n, q)).slice(0, 12);
    if (hits.length){
      A.palItems.push({ kind:'sec', label:'Notes' });
      hits.forEach(n => A.palItems.push({
        kind:'note', icon:'i-inbox', label:n.title || derivedTitle(n.body),
        sub:`${dayLabel(n.created_at)} · ${n.body.replace(/\s+/g,' ').slice(0,70)}`,
        run:() => selectNote(n.id),
      }));
    }
    const t = q.replace(/^#/,'').toLowerCase();
    const allTags = [...new Set(A.notes.flatMap(n => n.tags||[]))].filter(x => x.includes(t)).slice(0,5);
    if (allTags.length){
      A.palItems.push({ kind:'sec', label:'Tags' });

        kind:'tag', icon:'i-tag', label:'#'+tag,
        run:() => { A.view='tag'; A.tag=tag; render(); },
      }));
    }
    if (!hits.length && A.palItems.filter(i=>i.kind!=='sec').length === cmds.length){
      A.palItems.push({ kind:'sec', label:'Capture' });

function importJSON(){

      let added = 0, updated = 0;

      for (const r of incoming){
        if (!r.id || typeof r.body !== 'string') continue;

                      created_at:r.created_at || now(), updated_at:r.updated_at || now(),
                      title:r.title || derivedTitle(r.body), device:r.device || 'import',
                      ...r, _dirty:true };
        if (!local){ A.notes.push(rec); store.push(rec); added++; }
        else if ((rec.updated_at||'') > (local.updated_at||'')){ Object.assign(local, rec); store.push(local); updated++; }
      }
      await Store.putMany(store);
      resort(); render(); queueSync(); paintSettings();
      toast(`Imported — ${added} new, ${updated} updated`, 'ok');

/* ═══════════════════════════════════════════════════════════════
   PASSCODE
   An iPhone-style lock over the vault. The passcode is stored as a
   PBKDF2-SHA256 hash with a random salt — never in plain text — but
   be clear-eyed about what this is: a privacy screen, not encryption.
   The notes themselves are unencrypted in IndexedDB, so it stops a
   person picking up your phone, not someone with your unlocked
   laptop and the developer tools open.
   ═══════════════════════════════════════════════════════════════ */

const LOCK_DEFAULTS = { enabled:true, salt:'', hash:'', len:4, grace:0 };
const PBKDF2_ROUNDS = 210000;
const KEYPAD = [
  ['1',''], ['2','ABC'], ['3','DEF'],
  ['4','GHI'], ['5','JKL'], ['6','MNO'],
  ['7','PQRS'], ['8','TUV'], ['9','WXYZ'],
];

const L = {
  locked: document.documentElement.hasAttribute('data-locked'),
  mode: 'unlock',          // unlock | prompt
  buf: '',
  want: 4,
  resolve: null,
  attempts: 0,
  lockedUntil: 0,
  booted: false,
  hidAt: 0,
};

/* ── hashing ── */
function randSalt(){
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  return [...a].map(b => b.toString(16).padStart(2,'0')).join('');
}
async function hashPin(pin, saltHex){
  const enc = new TextEncoder();
  const salt = Uint8Array.from(saltHex.match(/../g).map(h => parseInt(h,16)));
  if (crypto.subtle){
    try {
      const key = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits(
        { name:'PBKDF2', salt, iterations:PBKDF2_ROUNDS, hash:'SHA-256' }, key, 256);
      return 'p:' + [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2,'0')).join('');
    } catch { /* fall through */ }
  }
  /* Fallback for opaque origins (opening the file directly with file://),
     where crypto.subtle is unavailable. Weaker — serve over https for the real thing. */
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  const src = saltHex + '␀' + pin;
  for (let round = 0; round < 40000; round++){
    for (let i = 0; i < src.length; i++){
      h1 ^= src.charCodeAt(i); h1 = Math.imul(h1, 16777619) >>> 0;
      h2 = Math.imul(h2 ^ (h1 + round), 2246822519) >>> 0;
    }
  }
  return 'f:' + h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}
async function setPin(pin){
  const salt = randSalt();
  S.lock = { ...LOCK_DEFAULTS, ...(S.lock||{}), enabled:true, salt,
             hash: await hashPin(pin, salt), len: pin.length };
  saveSettings();
}
async function checkPin(pin){
  if (!S.lock?.hash) return false;
  return (await hashPin(pin, S.lock.salt)) === S.lock.hash;
}
function lockOn(){ return !!(S.lock && S.lock.enabled && S.lock.hash); }

/* ── keypad UI ── */
function buildKeypad(){
  const k = $('#keypad'); if (k.childElementCount) return;
  KEYPAD.forEach(([d, letters]) => {
    const b = el('button','key');
    b.appendChild(el('b','',d));

  });
  k.appendChild(el('div','key blank'));

  zero.dataset.d = '0'; zero.onclick = () => press('0');
  k.appendChild(zero);
