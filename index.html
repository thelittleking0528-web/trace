  del.id = 'keyDel'; del.onclick = () => back();
  k.appendChild(del);
}
function paintDots(){
  const d = $('#pinDots'); d.innerHTML = '';
  for (let i = 0; i < L.want; i++){
    const dot = el('i'); if (i < L.buf.length) dot.classList.add('on');
    d.appendChild(dot);
  }
  const del = $('#keyDel');
  if (del) del.style.visibility = L.buf.length ? 'visible' : 'hidden';
}
function shake(msg){
  const d = $('#pinDots');
  d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
  if (navigator.vibrate) try { navigator.vibrate([12,60,12]); } catch {}
  const sub = $('#lockSub'); sub.textContent = msg; sub.classList.add('bad');
  L.buf = ''; setTimeout(paintDots, 90);
}
function press(d){
  if (Date.now() < L.lockedUntil) return;
  if (L.buf.length >= L.want) return;
  L.buf += d;
  $('#lockSub').classList.remove('bad');
  paintDots();
  if (L.buf.length === L.want) setTimeout(submit, 130);
}
function back(){
  if (!L.buf.length) return;
  L.buf = L.buf.slice(0, -1);
  $('#lockSub').classList.remove('bad');
  paintDots();
}
async function submit(){
  const entered = L.buf;
  if (L.mode === 'prompt'){
    L.buf = ''; paintDots();
    const fn = L.resolve; L.resolve = null;
    hideLock();
    fn && fn(entered);
    return;
  }
  if (await checkPin(entered)){
    L.attempts = 0;
    unlock();
  } else {
    L.attempts++;
    if (L.attempts >= 5){
      const wait = Math.min(60, 5 * Math.pow(2, L.attempts - 5));
      L.lockedUntil = Date.now() + wait * 1000;
      shake(`Too many attempts. Try again in ${wait}s.`);
      const tick = setInterval(() => {
        const left = Math.ceil((L.lockedUntil - Date.now())/1000);
        if (left <= 0){ clearInterval(tick); $('#lockSub').textContent = ''; $('#lockSub').classList.remove('bad'); }
        else $('#lockSub').textContent = `Too many attempts. Try again in ${left}s.`;
      }, 500);
    } else {
      shake(L.attempts >= 3 ? `Wrong passcode — ${5 - L.attempts} tries left` : 'Wrong passcode');
    }
  }
}

/* ── show / hide ── */
function showLock({ mode = 'unlock', title = 'Enter Passcode', sub = '', want = null, cancel = null } = {}){
  buildKeypad();
  $('#lock').classList.remove('opening');
  L.mode = mode; L.buf = '';
  L.want = want || S.lock?.len || 4;
  $('#lockTitle').textContent = title;
  const s = $('#lockSub'); s.textContent = sub; s.classList.remove('bad');
  const foot = $('#lockFoot'); foot.innerHTML = '';
  if (cancel){
    const c = el('button', null, 'Cancel');
    c.onclick = () => { const fn = L.resolve; L.resolve = null; hideLock(); fn && fn(null); };
    foot.appendChild(c);
  }
  document.documentElement.setAttribute('data-locked','1');
  L.locked = true;
  paintDots();
}
function hideLock(){
  const lk = $('#lock');
  lk.classList.add('opening');
  document.documentElement.removeAttribute('data-locked');
  L.locked = false;
  const app = $('#app');
  app.classList.add('revealing');
  setTimeout(() => { lk.classList.remove('opening'); app.classList.remove('revealing'); }, 520);
}
function unlock(){
  hideLock();
  if (!L.booted){ L.booted = true; afterUnlock(); }
  else if (window.innerWidth > 900 && A.view !== 'ask') setTimeout(() => cap.focus(), 340);
}
function lockNow(){
  if (!lockOn()){ toast('No passcode set — turn it on in Settings','err'); return; }
  L.attempts = 0; L.lockedUntil = 0;
  showLock({ title:'Enter Passcode' });
}
/* ask for a passcode and resolve with the digits (or null if cancelled) */
function askPin({ title, sub = '', want = 4 }){
  return new Promise(res => {
    L.resolve = res;
    showLock({ mode:'prompt', title, sub, want, cancel:true });
  });
}

/* ── settings flows ── */
async function changePasscode(){
  const cur = await askPin({ title:'Enter Current Passcode', want:S.lock.len });
  if (cur === null) return;
  if (!(await checkPin(cur))){ toast('Wrong passcode','err'); return; }
  await sleep(260);
  await newPasscodeFlow();
}
async function newPasscodeFlow(len){
  const want = len || S.lock?.len || 4;
  const a = await askPin({ title:'Enter a New Passcode', sub:`${want} digits`, want });
  if (a === null) return false;
  await sleep(260);
  const b = await askPin({ title:'Re-enter Your New Passcode', want });
  if (b === null) return false;
  if (a !== b){ toast("Those didn't match — nothing changed",'err'); return false; }
  await setPin(a);
  toast('Passcode changed','ok');
  paintSettings();
  return true;
}
async function togglePasscode(on){
  if (on){
    const ok = await newPasscodeFlow(4);
    if (!ok){ paintSettings(); return; }
  } else {
    const cur = await askPin({ title:'Enter Passcode', sub:'to turn the passcode off', want:S.lock.len });
    if (cur === null){ paintSettings(); return; }
    if (!(await checkPin(cur))){ toast('Wrong passcode','err'); paintSettings(); return; }
    S.lock.enabled = false; saveSettings();
    toast('Passcode off','ok');
  }
  paintSettings();
}

/* ── auto-lock + app-switcher veil ── */
const GRACE = [[0,'Now'],[60,'1 min'],[300,'5 min'],[900,'15 min']];
function graceLabel(){
  const g = (GRACE.find(x => x[0] === (S.lock?.grace ?? 0)) || [,'Now'])[1];
  return g === 'Now' ? 'Locks the moment you leave.' : `Locks ${g} after you leave.`;
}
document.addEventListener('visibilitychange', () => {
  if (!lockOn()) return;
  if (document.hidden){
    L.hidAt = Date.now();
    if (!L.locked) document.documentElement.setAttribute('data-cover','1');
  } else {
    document.documentElement.removeAttribute('data-cover');
    if (L.locked || L.mode === 'prompt') return;
    const elapsed = (Date.now() - L.hidAt) / 1000;
    if (elapsed >= (S.lock.grace ?? 0)) lockNow();
  }
});

/* ── keyboard on the lock screen ── */
document.addEventListener('keydown', e => {
  if (!L.locked) return;
  if (/^\d$/.test(e.key)){ e.preventDefault(); press(e.key);
    const b = $(`.key[data-d="${e.key}"]`);
    if (b){ b.classList.add('press'); setTimeout(() => b.classList.remove('press'), 120); }
    return; }
  if (e.key === 'Backspace'){ e.preventDefault(); back(); return; }
  if (e.key === 'Escape' && L.mode === 'prompt'){
    e.preventDefault();
    const fn = L.resolve; L.resolve = null; hideLock(); fn && fn(null);
  }
  e.stopPropagation();
}, true);

/* ═══════════════ CAPTURE ═══════════════ */
const cap = $('#capInput');
function autoGrow(t){ t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, window.innerHeight*0.44) + 'px'; }
function focusCapture(){
  if (A.view === 'ask'){ A.view = 'all'; render(); }
  cap.focus();
  cap.scrollIntoView({ block:'nearest' });
}
async function commitCapture(){
  const v = cap.value.trim();
  if (!v) return;
  cap.value = ''; autoGrow(cap);
  $('#capture').classList.remove('dirty');
  $('#saveBtn').disabled = true;
  const n = await createNote(v);
  toast('Saved · ' + timeOf(n.created_at), 'ok');
  if (A.view !== 'all' && A.view !== 'today'){ A.view = 'all'; A.tag = null; render(); }
  $('#listScroll').scrollTop = 0;
  cap.focus();
}
cap.addEventListener('input', () => {
  autoGrow(cap);
  const has = !!cap.value.trim();
  $('#capture').classList.toggle('dirty', has);
  $('#saveBtn').disabled = !has;
});
cap.addEventListener('focus', () => $('#capture').classList.add('focused'));
cap.addEventListener('blur',  () => $('#capture').classList.remove('focused'));
cap.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (modKey(e) || (S.enterSaves && !e.shiftKey))){
    e.preventDefault(); commitCapture();
  } else if (e.key === 'Escape'){ cap.value = ''; autoGrow(cap); cap.blur(); $('#saveBtn').disabled = true; }
});
$('#saveBtn').onclick = commitCapture;
$('#fab').onclick = focusCapture;

/* ═══════════════ VOICE ═══════════════ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recBase = '';
function toggleMic(){
  if (!SR){ toast('Dictation needs Safari or Chrome','err'); return; }
  if (rec){ rec.stop(); return; }
  rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || 'en-US';
  recBase = cap.value ? cap.value.replace(/\s+$/,'') + ' ' : '';
  rec.onstart = () => {
    $('#micBtn').classList.add('rec'); $('#micLbl').textContent = 'Listening';
    $('#capture').classList.add('focused');
  };
  rec.onresult = ev => {
    let fin = '', interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++){
      const r = ev.results[i];
      if (r.isFinal) fin += r[0].transcript; else interim += r[0].transcript;
    }
    if (fin) recBase += fin.replace(/^\s+/,'') + ' ';
    cap.value = recBase + interim;
    autoGrow(cap);
    $('#capture').classList.add('dirty'); $('#saveBtn').disabled = !cap.value.trim();
  };
  rec.onerror = ev => {
    if (ev.error === 'not-allowed') toast('Microphone permission denied','err');
    else if (ev.error !== 'aborted' && ev.error !== 'no-speech') toast('Dictation: ' + ev.error,'err');
  };
  rec.onend = () => {
    rec = null;
    $('#micBtn').classList.remove('rec'); $('#micLbl').textContent = 'Speak';
    cap.value = cap.value.replace(/\s+$/,'');
    autoGrow(cap); cap.focus();
  };
  try { rec.start(); } catch { rec = null; }
}
$('#micBtn').onclick = toggleMic;

/* ═══════════════ SEARCH ═══════════════ */
const searchInput = $('#searchInput');
searchInput.addEventListener('input', debounce(() => { A.query = searchInput.value; render(); }, 90));
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ searchInput.value=''; A.query=''; render(); searchInput.blur(); }
  if (e.key === 'Enter'){
    const first = visible()[0]; if (first) selectNote(first.id);
  }
});

/* ═══════════════ ASK BAR ═══════════════ */
const askIn = $('#askInput');
askIn.addEventListener('input', () => { askIn.style.height='auto'; askIn.style.height = Math.min(askIn.scrollHeight,180)+'px'; });
askIn.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); doAsk(); }
});
$('#askSend').onclick = () => doAsk();

/* ═══════════════ DETAIL BUTTONS ═══════════════ */
$('#dClose').onclick   = closeDetail;
$('#dStar').onclick    = () => { const n = byId(A.selected); if (n) patch(n.id, { starred: !n.starred }); };
$('#dEnrich').onclick  = () => { const n = byId(A.selected); if (n) enrich(n); };
$('#dArchive').onclick = () => {
  const n = byId(A.selected); if (!n) return;
  patch(n.id, { archived: !n.archived });
  toast(n.archived ? 'Archived' : 'Unarchived', 'ok');
};
$('#dTrash').onclick = () => {
  const n = byId(A.selected); if (!n) return;
  if (n.deleted_at){ patch(n.id, { deleted_at:null }); toast('Restored','ok'); return; }
  patch(n.id, { deleted_at: now() });
  const undo = toast('Moved to trash','ok');
  closeDetail();
};

/* ═══════════════ SIDEBAR / SHEETS ═══════════════ */
function closeSidebar(){ $('#sidebar').classList.remove('open'); }
$('#menuBtn').onclick = () => $('#sidebar').classList.toggle('open');
$('#settingsBtn').onclick = () => { closeSidebar(); openSettings(); };
$('#lockBtn').onclick = () => { closeSidebar(); lockNow(); };
$('#setClose').onclick = closeSettings;
$('#paletteBtn').onclick = () => openPal();
$('#scrim').onclick = () => { closePal(); closeSettings(); closeSidebar(); };
document.addEventListener('click', e => {
  const sb = $('#sidebar');
  if (sb.classList.contains('open') && !sb.contains(e.target) && e.target.closest('#menuBtn') === null)
    closeSidebar();
}, true);

/* ═══════════════ PALETTE INPUT ═══════════════ */
$('#palInput').addEventListener('input', () => { A.palIdx = 0; palRender(); });
$('#palInput').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown'){ e.preventDefault(); palMove(1); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); palMove(-1); }
  else if (e.key === 'Enter'){ e.preventDefault(); palRun(); }
  else if (e.key === 'Escape'){ e.preventDefault(); closePal(); }
});

/* ═══════════════ GLOBAL KEYS ═══════════════ */
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable;

  if (modKey(e) && e.key === 'k'){ e.preventDefault(); A.palOpen ? closePal() : openPal(); return; }
  if (modKey(e) && e.key === 'j'){ e.preventDefault(); openAsk(); return; }
  if (modKey(e) && e.key === 'f'){ e.preventDefault(); searchInput.focus(); searchInput.select(); return; }
  if (modKey(e) && e.key === ','){ e.preventDefault(); openSettings(); return; }
  if (modKey(e) && (e.key === 'n' || (e.shiftKey && e.key === 'N'))){ e.preventDefault(); focusCapture(); return; }
  if (modKey(e) && e.key === 's'){ e.preventDefault(); sync({ loud:true }); return; }
  if (modKey(e) && e.key === 'l'){ e.preventDefault(); lockNow(); return; }

  if (e.key === 'Escape'){
    if (A.palOpen){ closePal(); return; }
    if ($('#settings').classList.contains('on')){ closeSettings(); return; }
    if ($('#sidebar').classList.contains('open')){ closeSidebar(); return; }
    if (A.selected && !typing){ closeDetail(); return; }
    return;
  }
  if (typing || A.palOpen) return;

  /* single-key shortcuts when not typing */
  if (e.key === '/'){ e.preventDefault(); searchInput.focus(); return; }
  if (e.key === 'n'){ e.preventDefault(); focusCapture(); return; }
  if (e.key === 'a'){ e.preventDefault(); openAsk(); return; }

  const list = visible();
  if ((e.key === 'ArrowDown' || e.key === 'j') && list.length){
    e.preventDefault();
    const i = list.findIndex(n => n.id === A.selected);
    selectNote(list[Math.min(i + 1, list.length - 1)]?.id ?? list[0].id);
    $(`.note[data-id="${A.selected}"]`)?.scrollIntoView({ block:'nearest' });
  }
  if ((e.key === 'ArrowUp' || e.key === 'k') && list.length){
    e.preventDefault();
    const i = list.findIndex(n => n.id === A.selected);
    selectNote(list[Math.max(i - 1, 0)]?.id ?? list[0].id);
    $(`.note[data-id="${A.selected}"]`)?.scrollIntoView({ block:'nearest' });
  }
  if (A.selected){
    if (e.key === 's'){ e.preventDefault(); $('#dStar').click(); }
    if (e.key === 'e'){ e.preventDefault(); $('#dArchive').click(); }
    if (e.key === 'Backspace'){ e.preventDefault(); $('#dTrash').click(); }
  }
});

/* ═══════════════ LIFECYCLE ═══════════════ */
window.addEventListener('focus', () => sync());
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
window.addEventListener('online', () => sync());
window.addEventListener('resize', () => autoGrow(cap));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

/* ═══════════════ BOOT ═══════════════ */
let notesReady = null;

async function loadNotes(){
  try {
    A.notes = (await Store.all()) || [];
    A.notes.forEach(n => { n.tags = n.tags || []; });
    resort();
  } catch(e){ console.error('[trace] store load failed', e); }
}

/* Everything that puts a note on screen lives here, so nothing is
   painted into the DOM until the passcode has been accepted. */
async function afterUnlock(){
  await notesReady;
  render();
  paintThread();
  startSyncLoop();
  if (sbReady()) sync();

  /* home-screen shortcuts: ?new=1 / ?ask=1 */
  const params = new URLSearchParams(location.search);
  if (params.get('ask')) { openAsk(); }
  else if (params.get('new')) { setTimeout(() => focusCapture(), 150); }
  else if (window.innerWidth > 900) setTimeout(() => cap.focus(), 200);
  if (location.search) history.replaceState(null, '', location.pathname);
}

async function boot(){
  applyTheme();
  $('#searchKbd').textContent = IS_MAC ? '⌘F' : '^F';
  $('#lockKbd').textContent   = IS_MAC ? '⌘L' : '^L';
  $('#capHint').innerHTML = `<b>${MOD}↵</b> to save`;

  /* first run: a passcode is on by default */
  if (!S.lock || !S.lock.hash){
    S.lock = { ...LOCK_DEFAULTS };
    await setPin('0528');
  }

  notesReady = loadNotes();

  if (lockOn()){
    showLock({ title:'Enter Passcode' });
  } else {
    document.documentElement.removeAttribute('data-locked');
    L.booted = true;
    afterUnlock();
  }

  if ('serviceWorker' in navigator && location.protocol === 'https:'){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
boot();

/* expose a tiny console API — handy, and harmless */
window.trace = { get notes(){ return A.notes; }, sync, createNote, exportAll, settings: () => S };

})();
</script>
