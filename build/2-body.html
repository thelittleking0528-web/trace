<div id="app">

  <!-- ══════ SIDEBAR ══════ -->
  <aside id="sidebar">
    <div class="brand">
      <span class="mark"><svg><use href="#i-mark"/></svg></span>
      <h1>Trace</h1>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-group" id="navMain"></div>
      <div class="nav-group" id="navAI"></div>
      <div class="nav-group" id="navTags"></div>
    </nav>
    <div class="sidebar-foot">
      <button class="nav-item" id="lockBtn">
        <svg class="ico"><use href="#i-lock"/></svg><span class="lbl">Lock</span>
        <span class="kbd" id="lockKbd">⌘L</span>
      </button>
      <button class="nav-item" id="settingsBtn">
        <svg class="ico"><use href="#i-gear"/></svg><span class="lbl">Settings</span>
        <span class="status-dot" id="syncDot" title="Sync"></span>
      </button>
    </div>
  </aside>

  <!-- ══════ CENTER ══════ -->
  <main id="center">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menu"><svg><use href="#i-menu"/></svg></button>
      <span class="view-title" id="viewTitle">All Notes</span>
      <span class="view-sub" id="viewSub"></span>
      <span class="spacer"></span>
      <div class="search-wrap" id="searchWrap">
        <svg><use href="#i-search"/></svg>
        <input id="searchInput" type="text" placeholder="Search" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <span class="kbd" id="searchKbd">⌘F</span>
      </div>
      <button class="icon-btn" id="paletteBtn" title="Command palette (⌘K)"><svg><use href="#i-spark"/></svg></button>
    </header>

    <!-- capture -->
    <section id="capture">
      <div class="cap-shell">
        <textarea id="capInput" rows="1" placeholder="What's on your mind?" spellcheck="true" enterkeyhint="done"></textarea>
        <div class="cap-bar">
          <button class="btn ghost mic-btn" id="micBtn" title="Dictate"><svg><use href="#i-mic"/></svg><span id="micLbl">Speak</span></button>
          <span class="cap-hint" id="capHint"><b>⌘↵</b> to save</span>
          <button class="btn primary" id="saveBtn" disabled><svg><use href="#i-check"/></svg>Save</button>
        </div>
      </div>
    </section>

    <!-- list -->
    <div id="listScroll"><div id="list"></div></div>

    <!-- ask view -->
    <section id="askView" hidden>
      <div class="ask-scroll" id="askScroll"><div class="ask-inner" id="askThread"></div></div>
      <div class="ask-bar">
        <div class="ask-bar-inner">
          <textarea id="askInput" rows="1" placeholder="Ask anything about your notes…" enterkeyhint="send"></textarea>
          <button class="icon-btn" id="askSend" style="background:var(--accent);color:#fff;border-radius:999px"><svg><use href="#i-arrow-up"/></svg></button>
        </div>
      </div>
    </section>
  </main>

  <!-- ══════ DETAIL ══════ -->
  <aside id="detail" hidden>
    <div class="d-head">
      <span class="t">Note</span>
      <button class="icon-btn" id="dStar" title="Star"><svg><use href="#i-star"/></svg></button>
      <button class="icon-btn" id="dEnrich" title="Re-analyse with AI"><svg><use href="#i-spark"/></svg></button>
      <button class="icon-btn" id="dArchive" title="Archive"><svg><use href="#i-archive"/></svg></button>
      <button class="icon-btn" id="dTrash" title="Delete"><svg><use href="#i-trash"/></svg></button>
      <button class="icon-btn" id="dClose" title="Close"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="d-scroll" id="dScroll"></div>
  </aside>
</div>

<button id="fab" aria-label="New note"><svg><use href="#i-plus"/></svg></button>

<!-- ══════ PALETTE ══════ -->
<div id="scrim"></div>
<div id="palette" role="dialog" aria-label="Command palette">
  <div class="pal-in">
    <svg><use href="#i-search"/></svg>
    <input id="palInput" type="text" placeholder="Search notes or run a command…" autocomplete="off" spellcheck="false">
  </div>
  <div class="pal-list" id="palList"></div>
  <div class="pal-foot">
    <span><span class="kbd">↑↓</span> navigate</span>
    <span><span class="kbd">↵</span> open</span>
    <span><span class="kbd">esc</span> close</span>
  </div>
</div>

<!-- ══════ SETTINGS ══════ -->
<div class="sheet" id="settings" role="dialog" aria-label="Settings">
  <div class="sheet-grab"></div>
  <div class="sheet-head">
    <h2>Settings</h2>
    <button class="icon-btn" id="setClose"><svg><use href="#i-x"/></svg></button>
  </div>
  <div class="sheet-body" id="setBody"></div>
</div>

<!-- ══════ LOCK ══════ -->
<div id="lock" role="dialog" aria-label="Passcode">
  <div class="lock-top">
    <span class="lock-mark"><svg><use href="#i-mark"/></svg></span>
    <div class="lock-title" id="lockTitle">Enter Passcode</div>
    <div class="lock-sub" id="lockSub"></div>
  </div>
  <div class="pin-dots" id="pinDots"></div>
  <div class="keypad" id="keypad"></div>
  <div class="lock-foot" id="lockFoot"></div>
</div>

<div id="toasts"></div>
