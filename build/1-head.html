<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Trace</title>
<meta name="description" content="A place for thoughts you don't want to lose.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trace">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script>
/* Runs before first paint: if a passcode is set (or not yet configured),
   mark the document locked so no note is ever visible for a frame. */
try{
  var _s = JSON.parse(localStorage.getItem('trace.settings.v1') || '{}');
  if (!_s.lock || _s.lock.enabled !== false) document.documentElement.setAttribute('data-locked','1');
}catch(e){ document.documentElement.setAttribute('data-locked','1'); }
</script>
<style>
/* ─────────────────────────────────────────────────────────────
   Trace — design tokens
   ───────────────────────────────────────────────────────────── */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;

  --r-xs: 6px;  --r-sm: 10px;  --r-md: 14px;  --r-lg: 20px;  --r-xl: 28px;
  --e-out: cubic-bezier(.32,.72,0,1);
  --e-io:  cubic-bezier(.4,0,.2,1);
  --t-fast: .16s; --t-med: .3s; --t-slow: .52s;

  --sidebar-w: 224px;
  --detail-w: 380px;
  --safe-t: env(safe-area-inset-top,0px);
  --safe-b: env(safe-area-inset-bottom,0px);
  --safe-l: env(safe-area-inset-left,0px);
  --safe-r: env(safe-area-inset-right,0px);
}

/* Light */
:root{
  --bg:            #ffffff;
  --bg-under:      #f2f2f7;
  --chrome:        rgba(242,242,246,.80);
  --chrome-solid:  #f6f6f8;
  --elev:          rgba(255,255,255,.86);
  --text:          #1d1d1f;
  --text-2:        #6e6e73;
  --text-3:        #a5a5aa;
  --sep:           rgba(0,0,0,.085);
  --sep-strong:    rgba(0,0,0,.14);
  --fill:          rgba(118,118,128,.10);
  --fill-2:        rgba(118,118,128,.16);
  --fill-3:        rgba(118,118,128,.22);
  --accent:        #0071e3;
  --accent-soft:   rgba(0,113,227,.12);
  --accent-text:   #0071e3;
  --amber:         #b25000;
  --red:           #d70015;
  --green:         #248a3d;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05), 0 0 0 .5px rgba(0,0,0,.05);
  --shadow-md: 0 4px 16px rgba(0,0,0,.08), 0 0 0 .5px rgba(0,0,0,.06);
  --shadow-lg: 0 24px 68px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.08);
  --glow: none;
  color-scheme: light;
}
/* Dark */
@media (prefers-color-scheme: dark){
  :root{
    --bg:            #000000;
    --bg-under:      #0a0a0b;
    --chrome:        rgba(28,28,30,.68);
    --chrome-solid:  #1c1c1e;
    --elev:          rgba(38,38,41,.82);
    --text:          #f5f5f7;
    --text-2:        #9a9aa0;
    --text-3:        #636368;
    --sep:           rgba(255,255,255,.09);
    --sep-strong:    rgba(255,255,255,.16);
    --fill:          rgba(120,120,128,.18);
    --fill-2:        rgba(120,120,128,.26);
    --fill-3:        rgba(120,120,128,.34);
    --accent:        #0a84ff;
    --accent-soft:   rgba(10,132,255,.18);
    --accent-text:   #4da2ff;
    --amber:         #ff9f0a;
    --red:           #ff453a;
    --green:         #30d158;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.06);
    --shadow-md: 0 6px 24px rgba(0,0,0,.55), 0 0 0 .5px rgba(255,255,255,.08);
    --shadow-lg: 0 30px 80px rgba(0,0,0,.7), 0 0 0 .5px rgba(255,255,255,.1);
    color-scheme: dark;
  }
}
/* Manual overrides */
html[data-theme="light"]{ color-scheme: light; }
html[data-theme="dark"]{
  --bg:#000; --bg-under:#0a0a0b; --chrome:rgba(28,28,30,.68); --chrome-solid:#1c1c1e;
  --elev:rgba(38,38,41,.82); --text:#f5f5f7; --text-2:#9a9aa0; --text-3:#636368;
  --sep:rgba(255,255,255,.09); --sep-strong:rgba(255,255,255,.16);
  --fill:rgba(120,120,128,.18); --fill-2:rgba(120,120,128,.26); --fill-3:rgba(120,120,128,.34);
  --accent:#0a84ff; --accent-soft:rgba(10,132,255,.18); --accent-text:#4da2ff;
  --amber:#ff9f0a; --red:#ff453a; --green:#30d158;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.06);
  --shadow-md:0 6px 24px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.08);
  --shadow-lg:0 30px 80px rgba(0,0,0,.7),0 0 0 .5px rgba(255,255,255,.1);
  color-scheme: dark;
}

/* ─── reset ─── */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-size:15px; line-height:1.47; letter-spacing:-.011em;
  overscroll-behavior:none; -webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{ font:inherit; color:inherit; letter-spacing:inherit; }
button{ background:none; border:0; padding:0; cursor:pointer; }
input,textarea{ background:none; border:0; outline:0; resize:none; }
::selection{ background:var(--accent-soft); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-xs); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:transparent; border-radius:8px; border:3px solid transparent; background-clip:content-box; }
*:hover::-webkit-scrollbar-thumb{ background:var(--fill-2); background-clip:content-box; }

/* ─── app frame ─── */
#app{ display:flex; height:100dvh; width:100%; overflow:hidden; background:var(--bg-under); }

/* ─────────── SIDEBAR ─────────── */
#sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
  background:var(--chrome); backdrop-filter:saturate(180%) blur(30px);
  -webkit-backdrop-filter:saturate(180%) blur(30px);
  border-right:.5px solid var(--sep);
  display:flex; flex-direction:column;
  padding:calc(var(--safe-t) + 14px) 0 calc(var(--safe-b) + 8px) 0;
  padding-left:var(--safe-l);
  transition:margin-left var(--t-med) var(--e-out);
}
.brand{
  display:flex; align-items:center; gap:8px; padding:2px 16px 14px;
  -webkit-app-region:drag;
}
.brand .mark{
  width:22px; height:22px; border-radius:7px; flex:0 0 22px;
  background:linear-gradient(160deg,var(--text) 0%,var(--text-2) 100%);
  display:grid; place-items:center;
}
.brand .mark svg{ width:13px; height:13px; }
.brand h1{
  margin:0; font-size:15px; font-weight:590; letter-spacing:-.02em;
}
.nav{ flex:1; overflow-y:auto; padding:0 8px; }
.nav-group{ margin-bottom:16px; }
.nav-label{
  font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  color:var(--text-3); padding:0 8px 5px;
}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%;
  padding:6px 8px; border-radius:var(--r-xs); margin-bottom:1px;
  font-size:13.5px; font-weight:450; color:var(--text); text-align:left;
  transition:background var(--t-fast) var(--e-io);
}
.nav-item:hover{ background:var(--fill); }
.nav-item.active{ background:var(--fill-2); font-weight:520; }
.nav-item .ico{ width:16px; height:16px; flex:0 0 16px; color:var(--text-2); }
.nav-item.active .ico{ color:var(--accent-text); }
.nav-item .lbl{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nav-item .cnt{ font-size:12px; color:var(--text-3); font-variant-numeric:tabular-nums; }
.nav-item .dot{ width:7px; height:7px; border-radius:50%; flex:0 0 7px; }
.sidebar-foot{ padding:8px 8px 0; border-top:.5px solid var(--sep); margin:0 8px; }

/* ─────────── CENTER COLUMN ─────────── */
#center{
  flex:1; min-width:0; display:flex; flex-direction:column;
  background:var(--bg); position:relative;
}
.topbar{
  display:flex; align-items:center; gap:10px;
  padding:calc(var(--safe-t) + 10px) 16px 10px;
  border-bottom:.5px solid var(--sep);
  background:var(--chrome); backdrop-filter:saturate(180%) blur(30px);
  -webkit-backdrop-filter:saturate(180%) blur(30px);
  position:sticky; top:0; z-index:20;
}
.icon-btn{
  width:30px; height:30px; border-radius:var(--r-xs); display:grid; place-items:center;
  color:var(--text-2); flex:0 0 30px;
  transition:background var(--t-fast) var(--e-io), color var(--t-fast) var(--e-io);
}
.icon-btn:hover{ background:var(--fill); color:var(--text); }
.icon-btn.on{ background:var(--accent-soft); color:var(--accent-text); }
.icon-btn svg{ width:17px; height:17px; }
#menuBtn{ display:none; }
.view-title{ font-size:15px; font-weight:590; letter-spacing:-.02em; flex:0 0 auto; }
.view-sub{ font-size:12.5px; color:var(--text-3); font-variant-numeric:tabular-nums; }
.topbar .spacer{ flex:1; }

.search-wrap{
  display:flex; align-items:center; gap:7px; flex:1; max-width:340px;
  background:var(--fill); border-radius:var(--r-sm); padding:5px 9px;
  transition:background var(--t-fast) var(--e-io), box-shadow var(--t-fast) var(--e-io);
}
.search-wrap:focus-within{ background:var(--bg); box-shadow:0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent); }
.search-wrap svg{ width:14px; height:14px; color:var(--text-3); flex:0 0 14px; }
.search-wrap input{ flex:1; min-width:0; font-size:13.5px; }
.search-wrap input::placeholder{ color:var(--text-3); }
.kbd{
  font-family:var(--font); font-size:11px; font-weight:500; color:var(--text-3);
  background:var(--fill-2); border-radius:4px; padding:1.5px 5px; letter-spacing:0;
}

/* ─── capture ─── */
#capture{
  padding:20px 24px 16px; border-bottom:.5px solid var(--sep);
  background:var(--bg); position:relative;
  transition:padding var(--t-med) var(--e-out);
}
#capture.focused{ padding-bottom:12px; }
.cap-shell{
  border-radius:var(--r-md); background:var(--bg);
  box-shadow:0 0 0 1px var(--sep-strong);
  transition:box-shadow var(--t-med) var(--e-out), transform var(--t-med) var(--e-out);
}
#capture.focused .cap-shell{
  box-shadow:0 0 0 1px var(--accent), 0 0 0 4px var(--accent-soft), var(--shadow-md);
}
#capInput{
  width:100%; display:block; padding:14px 16px 4px; font-size:16.5px; line-height:1.5;
  min-height:52px; max-height:44vh; overflow-y:auto; letter-spacing:-.014em;
  font-family:var(--font);
}
#capInput::placeholder{ color:var(--text-3); }
.cap-bar{
  display:flex; align-items:center; gap:6px; padding:6px 10px 8px 12px;
  opacity:0; max-height:0; overflow:hidden;
  transition:opacity var(--t-med) var(--e-out), max-height var(--t-med) var(--e-out);
}
#capture.focused .cap-bar, #capture.dirty .cap-bar{ opacity:1; max-height:52px; }
.cap-hint{ flex:1; font-size:12px; color:var(--text-3); }
.cap-hint b{ font-weight:500; color:var(--text-2); }
.btn{
  display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 12px;
  border-radius:999px; font-size:13px; font-weight:510; letter-spacing:-.01em;
  background:var(--fill-2); color:var(--text);
  transition:background var(--t-fast) var(--e-io), transform var(--t-fast) var(--e-out), opacity var(--t-fast);
}
.btn:hover{ background:var(--fill-3); }
.btn:active{ transform:scale(.96); }
.btn.primary{ background:var(--accent); color:#fff; }
.btn.primary:hover{ filter:brightness(1.08); }
.btn.ghost{ background:transparent; color:var(--text-2); }
.btn.ghost:hover{ background:var(--fill); color:var(--text); }
.btn[disabled]{ opacity:.4; pointer-events:none; }
.btn svg{ width:14px; height:14px; }
.btn.sm{ height:24px; font-size:12px; padding:0 9px; }

.mic-btn{ position:relative; }
.mic-btn.rec{ background:var(--red); color:#fff; }
.mic-btn.rec::after{
  content:''; position:absolute; inset:-4px; border-radius:999px;
  border:2px solid var(--red); animation:pulse 1.6s var(--e-io) infinite;
}
@keyframes pulse{ 0%{opacity:.7;transform:scale(1)} 100%{opacity:0;transform:scale(1.35)} }

/* ─── list ─── */
#listScroll{ flex:1; overflow-y:auto; overscroll-behavior:contain; }
#list{ padding:6px 12px calc(var(--safe-b) + 80px); }
.day-head{
  display:flex; align-items:baseline; gap:8px;
  padding:18px 12px 6px; position:sticky; top:0; z-index:5;
  background:linear-gradient(var(--bg) 62%, transparent);
  backdrop-filter:blur(2px);
}
.day-head h3{ margin:0; font-size:13px; font-weight:600; letter-spacing:-.01em; }
.day-head span{ font-size:11.5px; color:var(--text-3); font-variant-numeric:tabular-nums; }

.note{
  position:relative; display:block; width:100%; text-align:left;
  padding:11px 13px; border-radius:var(--r-sm); margin-bottom:2px;
  transition:background var(--t-fast) var(--e-io);
  animation:noteIn var(--t-slow) var(--e-out) both;
}
@keyframes noteIn{ from{opacity:0; transform:translateY(6px) scale(.995)} to{opacity:1;transform:none} }
.note:hover{ background:var(--fill); }
.note.sel{ background:var(--fill-2); }
.note.sel::before{
  content:''; position:absolute; left:0; top:9px; bottom:9px; width:3px;
  border-radius:0 3px 3px 0; background:var(--accent);
}
.note-top{ display:flex; align-items:center; gap:7px; margin-bottom:2px; }
.note-title{
  font-size:14px; font-weight:560; letter-spacing:-.014em; color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0;
}
.note-time{ font-size:11.5px; color:var(--text-3); font-variant-numeric:tabular-nums; flex:0 0 auto; }
.note-body{
  font-size:13.5px; color:var(--text-2); line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  white-space:pre-wrap; word-break:break-word;
}
.note-meta{ display:flex; align-items:center; gap:5px; margin-top:6px; flex-wrap:wrap; }
.tag{
  font-size:11px; font-weight:500; padding:2px 7px; border-radius:999px;
  background:var(--fill); color:var(--text-2); letter-spacing:-.005em;
}
.tag.ai{ background:var(--accent-soft); color:var(--accent-text); }
.star{ color:var(--amber); width:12px; height:12px; flex:0 0 12px; }
mark{ background:rgba(255,214,10,.34); color:inherit; border-radius:3px; padding:0 1px; }
html[data-theme="dark"] mark, :root:not([data-theme]) mark{ }
@media (prefers-color-scheme: dark){ mark{ background:rgba(255,214,10,.26); } }

.empty{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; padding:72px 32px; text-align:center; color:var(--text-3);
  animation:noteIn var(--t-slow) var(--e-out) both;
}
.empty svg{ width:30px; height:30px; opacity:.45; margin-bottom:4px; }
.empty h4{ margin:0; font-size:14.5px; font-weight:560; color:var(--text-2); letter-spacing:-.015em; }
.empty p{ margin:0; font-size:13px; max-width:270px; line-height:1.5; }

/* ─────────── DETAIL ─────────── */
#detail{
  width:var(--detail-w); flex:0 0 var(--detail-w);
  background:var(--chrome); backdrop-filter:saturate(180%) blur(30px);
  -webkit-backdrop-filter:saturate(180%) blur(30px);
  border-left:.5px solid var(--sep);
  display:flex; flex-direction:column; overflow:hidden;
  padding-right:var(--safe-r);
}
#detail[hidden]{ display:none; }
.d-head{
  display:flex; align-items:center; gap:6px;
  padding:calc(var(--safe-t) + 10px) 12px 10px 16px; border-bottom:.5px solid var(--sep);
}
.d-head .t{ flex:1; font-size:13px; font-weight:600; letter-spacing:-.01em; }
.d-scroll{ flex:1; overflow-y:auto; padding:16px 18px calc(var(--safe-b) + 24px); }
.d-title{
  font-size:19px; font-weight:640; letter-spacing:-.026em; line-height:1.28; margin:0 0 3px;
}
.d-stamp{ font-size:12px; color:var(--text-3); font-variant-numeric:tabular-nums; margin-bottom:14px; }
.d-body{
  font-size:14.5px; line-height:1.62; white-space:pre-wrap; word-break:break-word;
  width:100%; display:block; font-family:var(--font); letter-spacing:-.008em;
  min-height:80px; padding:0;
}
.d-sec{ margin-top:22px; padding-top:16px; border-top:.5px solid var(--sep); }
.d-sec-h{
  display:flex; align-items:center; gap:6px; margin-bottom:9px;
  font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--text-3);
}
.d-sec-h svg{ width:12px; height:12px; }
.d-sec-h .grow{ flex:1; }
.chips{ display:flex; flex-wrap:wrap; gap:5px; }
.chip{
  font-size:12px; padding:3px 9px; border-radius:999px; background:var(--fill);
  color:var(--text-2); transition:background var(--t-fast);
}
button.chip:hover{ background:var(--fill-2); color:var(--text); }
.chip.add{ border:1px dashed var(--sep-strong); background:transparent; }
.ai-card{
  background:var(--fill); border-radius:var(--r-sm); padding:11px 12px;
  font-size:13.5px; line-height:1.55; color:var(--text-2);
}
.ai-card strong{ color:var(--text); font-weight:560; }
.link-note{
  display:block; width:100%; text-align:left; padding:8px 10px; border-radius:var(--r-xs);
  margin-bottom:2px; transition:background var(--t-fast);
}
.link-note:hover{ background:var(--fill); }
.link-note .t{ font-size:13px; font-weight:520; color:var(--text); display:block;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.link-note .s{ font-size:11.5px; color:var(--text-3); }

/* ─────────── ASK / AI VIEW ─────────── */
#askView{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
#askView[hidden]{ display:none !important; }
.ask-scroll{ flex:1; overflow-y:auto; padding:24px 0 24px; }
.ask-inner{ max-width:680px; margin:0 auto; padding:0 24px; }
.msg{ margin-bottom:22px; animation:noteIn var(--t-slow) var(--e-out) both; }
.msg .who{
  font-size:11px; font-weight:600; letter-spacing:.045em; text-transform:uppercase;
  color:var(--text-3); margin-bottom:6px; display:flex; align-items:center; gap:6px;
}
.msg .who svg{ width:12px; height:12px; }
.msg .txt{ font-size:15px; line-height:1.62; white-space:pre-wrap; letter-spacing:-.01em; }
.msg.me .txt{ font-weight:500; }
.msg .cites{ display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
.cite{
  font-size:11.5px; padding:3px 9px; border-radius:999px; background:var(--fill);
  color:var(--text-2); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
button.cite:hover{ background:var(--fill-2); color:var(--text); }
.ask-bar{
  border-top:.5px solid var(--sep); padding:12px 24px calc(var(--safe-b) + 14px);
  background:var(--chrome); backdrop-filter:blur(30px);
}
.ask-bar-inner{ max-width:680px; margin:0 auto; display:flex; align-items:flex-end; gap:8px;
  background:var(--bg); border-radius:var(--r-md); box-shadow:0 0 0 1px var(--sep-strong); padding:8px 8px 8px 14px; }
.ask-bar-inner:focus-within{ box-shadow:0 0 0 1px var(--accent), 0 0 0 4px var(--accent-soft); }
#askInput{ flex:1; font-size:15px; line-height:1.5; max-height:180px; overflow-y:auto; padding:5px 0; }
.typing{ display:inline-flex; gap:3px; align-items:center; height:1em; }
.typing i{ width:5px;height:5px;border-radius:50%;background:var(--text-3);animation:blink 1.2s var(--e-io) infinite; }
.typing i:nth-child(2){animation-delay:.18s} .typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{ 0%,60%,100%{opacity:.25} 30%{opacity:1} }
.suggest{ display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
.suggest button{
  font-size:13px; padding:6px 12px; border-radius:999px; background:var(--fill);
  color:var(--text-2); transition:background var(--t-fast), color var(--t-fast);
}
.suggest button:hover{ background:var(--fill-2); color:var(--text); }

/* ─────────── PALETTE ─────────── */

/* ─────────── LOCK SCREEN ─────────── */
#lock{
  position:fixed; inset:0; z-index:300; display:none;

}

  content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 70% at 50% -10%, var(--fill) 0%, transparent 62%);
}

html[data-locked] #toasts, html[data-locked] #palette, html[data-locked] .sheet{
  visibility:hidden !important;
}

html[data-cover] #app, html[data-cover] #fab{ filter:blur(30px); transition:filter .18s var(--e-io); }

.lock-top{ display:flex; flex-direction:column; align-items:center; gap:0; position:relative; }
.lock-mark{
  width:52px; height:52px; border-radius:15px; margin-bottom:20px;

  animation:lockIn .6s var(--e-out) both;
}

  letter-spacing:-.01em;
}

.pin-dots{ display:flex; gap:19px; margin:26px 0 34px; position:relative; }

  width:13px; height:13px; border-radius:50%; display:block;
  box-shadow:inset 0 0 0 1.5px var(--text-2); background:transparent;
  transition:background .18s var(--e-out), transform .18s var(--e-out), box-shadow .18s var(--e-out);
}
.pin-dots i.on{ background:var(--text); box-shadow:inset 0 0 0 1.5px var(--text); transform:scale(1.06); }

@keyframes shake{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-9px)} 40%,60%{transform:translateX(9px)}
}

.keypad{
  display:grid; grid-template-columns:repeat(3,76px); gap:22px 26px;
  place-items:center; position:relative;
}
.key{
  width:76px; height:76px; border-radius:50%; background:var(--fill);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;

}

.key.word:active{ background:none; opacity:.5; transform:none; }
.lock-foot{ margin-top:26px; min-height:22px; }

@media (max-height:720px){

  .lock-mark{ width:44px;height:44px;margin-bottom:14px;border-radius:13px; }
  .pin-dots{ margin:20px 0 26px; }
}

}

/* unlock reveal */
